<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Pole Position</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --neon-pink: #ff00ff;
        --neon-blue: #00ffff;
        --neon-green: #00ff00;
        --neon-purple: #bd00ff;
        --neon-red: #ff3333;
        --neon-orange: #ff6600;
        --bg-color: #050505;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: #fff;
        font-family: "Press Start 2P", monospace;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* CRT Effect Overlay */
      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
          ),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.06)
          );
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 10;
        animation: flicker 0.15s infinite;
      }

      .crt-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        z-index: 9;
      }

      @keyframes flicker {
        0% {
          opacity: 0.9;
        }
        5% {
          opacity: 0.85;
        }
        10% {
          opacity: 0.9;
        }
        15% {
          opacity: 1;
        }
        20% {
          opacity: 0.9;
        }
        25% {
          opacity: 0.85;
        }
        100% {
          opacity: 0.9;
        }
      }

      #game-container {
        position: relative;
        border: 4px solid #333;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px var(--neon-orange);
      }

      canvas {
        display: block;
        background-color: #000;
        image-rendering: pixelated; /* Essential for retro look */
      }

      .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        z-index: 5;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        width: 100%;
        text-shadow: 2px 2px #000;
        font-size: 20px;
        color: #fff;
      }

      .hud-score {
        color: var(--neon-blue);
      }
      .hud-time {
        color: var(--neon-green);
      }
      .hud-best {
        color: var(--neon-orange);
      }
      .hud-speed {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: var(--neon-red);
        font-size: 24px;
        text-align: right;
      }

      .countdown-clock {
        position: absolute;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 56px;
        color: var(--neon-green);
        text-shadow: 4px 4px 0 #000, 0 0 24px var(--neon-green);
        font-variant-numeric: tabular-nums;
      }

      .countdown-clock.low {
        color: var(--neon-red);
        text-shadow: 4px 4px 0 #000, 0 0 24px var(--neon-red);
        animation: pulse 0.5s infinite;
      }

      .center-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        color: var(--neon-red);
        text-shadow: 4px 4px 0 #000;
        display: none;
        text-transform: uppercase;
        animation: pulse 0.5s infinite;
      }

      .countdown {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        color: var(--neon-green);
        text-shadow: 6px 6px 0 #000, 0 0 40px var(--neon-green);
        display: none;
        z-index: 25;
      }

      @keyframes pulse {
        0% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      .start-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      h1 {
        font-size: 48px;
        color: var(--neon-orange);
        text-shadow: 4px 4px var(--neon-purple);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-align: center;
      }

      .press-start {
        font-size: 24px;
        color: #fff;
        animation: blink 1s infinite;
        margin-top: 40px;
        cursor: pointer;
        pointer-events: auto;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .controls-hint {
        margin-top: 60px;
        font-family: "Share Tech Mono", monospace;
        color: #aaa;
        font-size: 16px;
        text-align: center;
        line-height: 1.5;
      }

      .key {
        display: inline-block;
        border: 1px solid #777;
        border-radius: 4px;
        padding: 2px 6px;
        background: #222;
        color: #fff;
        margin: 0 2px;
        font-size: 12px;
      }

      .results {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px 48px;
        background: rgba(0, 0, 0, 0.85);
        border: 3px solid var(--neon-orange);
        box-shadow: 0 0 30px var(--neon-orange);
        z-index: 25;
        pointer-events: auto;
      }

      .results h2 {
        margin: 0;
        font-size: 32px;
        color: var(--neon-orange);
        letter-spacing: 4px;
      }

      .result-rows {
        font-family: "Share Tech Mono", monospace;
        font-size: 18px;
        color: #fff;
        line-height: 1.8;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .result-best {
        font-size: 16px;
        color: var(--neon-green);
        letter-spacing: 2px;
      }

      .result-restart {
        font-size: 14px;
        color: #fff;
        animation: blink 1s infinite;
        letter-spacing: 2px;
      }

    </style>
    <link rel="stylesheet" href="../arcade/arcade.css" />
  </head>
  <body>
    <div class="crt-overlay"></div>
    <div class="crt-glow"></div>

    <div id="game-container">
      <canvas id="gameCanvas" width="1024" height="768"></canvas>

      <div class="ui-layer" id="gameUI">
        <div class="hud-top">
          <div class="hud-score">LAP <span id="lapVal">1</span>/3</div>
          <div class="hud-time">LAP TIME <span id="timeVal">0.00</span></div>
          <div class="hud-score">SCORE <span id="scoreVal">0</span></div>
          <div class="hud-best">BEST <span id="bestVal">--</span></div>
        </div>
        <div class="center-message" id="message">CRASH!</div>
        <div class="countdown" id="countdown"></div>
        <div class="countdown-clock" id="raceClock">90</div>
        <div class="hud-speed"><span id="speedVal">0</span> km/h</div>
        <div class="results" id="results"></div>
      </div>

      <div class="start-screen" id="startScreen">
        <h1>FAKE POLE POSITION</h1>
        <div class="press-start" onclick="startGame()">
          INSERT COIN TO START
        </div>

        <pre id="highScores" style="color: #ff0; font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 1.6; margin-top: 24px"></pre>

        <div class="controls-hint">
          <span class="key">↑</span> ACCELERATE &nbsp;
          <span class="key">↓</span> BRAKE <br />
          <span class="key">←</span> LEFT &nbsp;
          <span class="key">→</span> RIGHT <br /><br />
          <span class="key">P</span> PAUSE &nbsp;
          <span class="key">M</span> MUTE &nbsp;
          <span class="key">ESC</span> ARCADE
        </div>
      </div>
    </div>

    <script src="../arcade/audio.js"></script>
    <script src="../arcade/input.js"></script>
    <script src="../arcade/scores.js"></script>
    <script src="../arcade/shell.js"></script>
    <script>
      // Game Constants
      const FPS = 60;
      const STEP = 1 / FPS;
      const ROAD_WIDTH = 2000;
      const SEGMENT_LENGTH = 200;
      const RUMBLE_LENGTH = 3;
      const LANES = 3;
      const FIELD_OF_VIEW = 100;
      const CAMERA_HEIGHT = 1000;
      const DRAW_DISTANCE = 300;
      const FOG_DENSITY = 5;
      const PLAYER_WIDTH = 800; // Hitbox width approx
      const CAR_WIDTH = 800; // AI Car hitbox approx
      const NUM_CARS = 5;

      // Colors
      const COLORS = {
        SKY: "#111",
        TREE: "#327C37",
        FOG: "#005108",
        LIGHT: {
          road: "#6B6B6B",
          grass: "#10AA10",
          rumble: "#555555",
          lane: "#CCCCCC",
        },
        DARK: { road: "#696969", grass: "#009A00", rumble: "#BBBBBB" },
        START: { road: "white", grass: "white", rumble: "white" },
        FINISH: { road: "black", grass: "black", rumble: "black" },
      };

      // Game State
      let canvas, ctx;
      let width = 1024;
      let height = 768;
      let segments = [];
      let cars = [];

      let playerX = 0;
      let playerZ = 0;
      let speed = 0;
      let maxSpeed = 12000;
      let accel = maxSpeed / 5;
      let breaking = -maxSpeed;
      let decel = -maxSpeed / 5;
      let offRoadDecel = -maxSpeed / 2;
      let offRoadLimit = maxSpeed / 4;

      let gameTime = 0;
      let isCrashed = false;
      let crashTimer = 0;
      let raceFinished = false;

      // Countdown state
      let countdownActive = false;
      let countdownValue = 3;
      let countdownTimer = 0;
      let raceStarted = false;

      // Lap tracking
      /* ------------------------------------------------ the countdown ---
       *
       * Pole Position is a race against a clock, not just against cars. You
       * start with a fixed number of seconds and buy more by getting round the
       * lap. Run out and the game ends where you stand - which is a different
       * ending from crossing the line, and gets a different panel.
       *
       * Laps stay as the win condition, which is how the arcade works too: the
       * clock can end you early, but finishing the distance is what wins.
       */
      const RACE_START_TIME = 90; // seconds on the clock at the green flag
      const LAP_EXTENSION = 30; // seconds bought by getting round
      const LOW_TIME_WARNING = 10;

      // Scoring, which this cabinet has never had. Distance pays as you drive,
      // laps pay a lump, and whatever is left on the clock pays out at the end.
      const SCORE_PER_UNIT = 0.0006;
      const LAP_BONUS = 1000;
      const TIME_BONUS_PER_SEC = 200;

      const GAME_KEY = "poleposition";
      let raceTime = RACE_START_TIME;
      let score = 0;
      let finishReason = "finish"; // or "timeup"

      const TOTAL_LAPS = 3;
      let playerLap = 1;
      let playerLapTimes = [];
      let playerBestLap = null;
      let playerLastZ = 0;

      let keyLeft = false;
      let keyRight = false;
      let keyFaster = false;
      let keySlower = false;

      let gameRunning = false;
      let lastTime = 0;

      // Utility Functions
      function easeIn(a, b, percent) {
        return a + (b - a) * Math.pow(percent, 2);
      }
      function easeOut(a, b, percent) {
        return a + (b - a) * (1 - Math.pow(1 - percent, 2));
      }
      function easeInOut(a, b, percent) {
        return a + (b - a) * (-Math.cos(percent * Math.PI) / 2 + 0.5);
      }
      function percentRemaining(n, total) {
        return (n % total) / total;
      }
      function interpolate(a, b, percent) {
        return a + (b - a) * percent;
      }
      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      function project(
        p,
        cameraX,
        cameraY,
        cameraZ,
        cameraDepth,
        width,
        height,
        roadWidth
      ) {
        p.camera.x = (p.world.x || 0) - cameraX;
        p.camera.y = (p.world.y || 0) - cameraY;
        p.camera.z = (p.world.z || 0) - cameraZ;

        if (p.camera.z < 1) {
          p.screen.scale = 0;
        } else {
          p.screen.scale = cameraDepth / p.camera.z;
        }

        p.screen.x = Math.round(
          width / 2 + (p.screen.scale * p.camera.x * width) / 2
        );
        p.screen.y = Math.round(
          height / 2 - (p.screen.scale * p.camera.y * height) / 2
        );
        p.screen.w = Math.round((p.screen.scale * roadWidth * width) / 2);
      }

      function overlap(x1, w1, x2, w2, percent) {
        let half = percent || 1;
        let min1 = x1 - w1 * half;
        let max1 = x1 + w1 * half;
        let min2 = x2 - w2 * half;
        let max2 = x2 + w2 * half;
        return !(max1 < min2 || min1 > max2);
      }

      function init() {
        canvas = document.getElementById("gameCanvas");
        ctx = canvas.getContext("2d");
        width = canvas.width;
        height = canvas.height;

        // Event Listeners
        // Steering is polled from Arcade.Input every frame; only the restart
        // needs a press edge of its own.
        document.addEventListener("keydown", function (e) {
          if (raceFinished && (e.key === "r" || e.key === "R")) startGame();
        });

        requestAnimationFrame(frame);
      }

      function addSegment(curve, y) {
        let n = segments.length;
        segments.push({
          index: n,
          p1: {
            world: { z: n * SEGMENT_LENGTH, y: lastY(), x: 0 },
            camera: {},
            screen: {},
          },
          p2: {
            world: { z: (n + 1) * SEGMENT_LENGTH, y: y, x: 0 },
            camera: {},
            screen: {},
          },
          curve: curve,
          cars: [],
          color: Math.floor(n / RUMBLE_LENGTH) % 2 ? COLORS.DARK : COLORS.LIGHT,
        });
      }

      function lastY() {
        return segments.length === 0
          ? 0
          : segments[segments.length - 1].p2.world.y;
      }

      function resetRoad() {
        segments = [];
        const NUM_SEGMENTS = 2000;

        for (let n = 0; n < NUM_SEGMENTS; n++) {
          let curve = 0;
          let y = 0;

          if (n > 200 && n < 400) curve = 4;
          if (n > 800 && n < 1200) curve = -4;
          if (n > 1500 && n < 1700) curve = 3;

          if (n > 500 && n < 700) {
            let range = 200;
            let i = n - 500;
            y = Math.sin((i / range) * Math.PI) * 1500;
          }

          addSegment(curve, y);
        }
        segments[NUM_SEGMENTS - 1].color = COLORS.FINISH;

        cars = [];
        for (let i = 0; i < NUM_CARS; i++) {
          let offset =
            Math.random() *
            randomInt(0.4, 0.8) *
            (Math.random() > 0.5 ? 1 : -1);
          // Spawn cars closer to player - spread across segments 20-300
          let z = Math.floor(20 + i * 60 + Math.random() * 40) * SEGMENT_LENGTH;
          let speed = maxSpeed / 2 + Math.random() * (maxSpeed / 3);
          let car = {
            offset: offset,
            z: z,
            speed: speed,
            color: ["#0000FF", "#00FF00", "#FFFF00", "#FFFFFF", "#00FFFF"][
              i % 5
            ],
          };
          cars.push(car);
          let segment = findSegment(car.z);
          segment.cars.push(car);
        }

        playerX = 0;
        playerZ = 0;
        speed = 0;
        isCrashed = false;
        gameTime = 0;
      }

      function startGame() {
        document.getElementById("startScreen").style.display = "none";
        gameRunning = true;
        raceStarted = false;
        raceFinished = false;
        Sound.stopEngine();
        document.getElementById("results").style.display = "none";
        document.getElementById("message").style.display = "none";
        countdownActive = true;
        countdownValue = 3;
        countdownTimer = 1;
        playerLap = 1;
        raceTime = RACE_START_TIME;
        score = 0;
        finishReason = "finish";
        document.getElementById("raceClock").classList.remove("low");
        document.getElementById("raceClock").innerText = RACE_START_TIME;
        playerLapTimes = [];
        playerBestLap = null;
        playerLastZ = 0;
        resetRoad();
        Sound.init();

        // Show initial countdown
        document.getElementById("countdown").style.display = "block";
        document.getElementById("countdown").innerText = "3";
        Sound.playBeep(440); // First beep
      }

      // The track keeps rendering behind the results panel, so the race ends by
      // freezing the sim rather than by tearing the world down.
      /** `reason` is "finish" when the distance is done, "timeup" when it is not. */
      function finishRace(reason) {
        if (raceFinished) return;

        finishReason = reason || "finish";
        raceFinished = true;
        speed = 0;
        Sound.stopEngine();
        Sound.stopMusic();

        // Whatever is left on the clock only pays out if you got there.
        let timeBonus = 0;
        if (finishReason === "finish") {
          timeBonus = Math.floor(raceTime) * TIME_BONUS_PER_SEC;
          score += timeBonus;
        }
        updateHud();

        const won = finishReason === "finish";
        const rows = playerLapTimes
          .map((t, i) => "LAP " + (i + 1) + "&nbsp;&nbsp;" + t.toFixed(2))
          .join("<br />");
        const best = playerBestLap === null ? "--" : playerBestLap.toFixed(2);

        const results = document.getElementById("results");
        results.innerHTML =
          "<h2>" + (won ? "FINISH" : "TIME UP") + "</h2>" +
          '<div class="result-rows">' +
          (rows || "NO LAPS COMPLETED") +
          "</div>" +
          '<div class="result-best">BEST LAP ' + best + "</div>" +
          (timeBonus
            ? '<div class="result-best">TIME BONUS ' + timeBonus + "</div>"
            : "") +
          '<div class="result-best">SCORE ' + Math.floor(score) + "</div>" +
          '<div class="result-restart">PRESS R TO RACE AGAIN</div>';
        results.style.display = "flex";
        results.style.borderColor = won ? "var(--neon-orange)" : "var(--neon-red)";

        const total = Math.floor(score);
        if (Arcade.Scores.qualifies(GAME_KEY, total)) {
          Arcade.Scores.promptInitials(total, (initials) => {
            Arcade.Scores.submit(GAME_KEY, initials, total);
            renderScores();
          });
        }
        renderScores();
      }

      function renderScores() {
        const el = document.getElementById("highScores");
        if (el) el.textContent = Arcade.Scores.format(GAME_KEY);
      }

      /** Runs the race clock down and ends the game when it empties. */
      function updateRaceClock(dt) {
        raceTime -= dt;

        const clock = document.getElementById("raceClock");
        clock.innerText = Math.max(0, Math.ceil(raceTime));
        clock.classList.toggle("low", raceTime <= LOW_TIME_WARNING);

        if (raceTime <= 0) {
          raceTime = 0;
          finishRace("timeup");
        }
      }

      function crash(car) {
        if (isCrashed) return;
        isCrashed = true;
        speed = 0;
        crashTimer = 3;
        document.getElementById("message").style.display = "block";
        document.getElementById("message").innerText = "CRASH!";

        if (car) {
          car.z += 1000;
          car.speed += 500;
        }
      }

      function update(dt) {
        if (!gameRunning || raceFinished || Arcade.Shell.paused) return;

        // Handle countdown
        if (countdownActive) {
          countdownTimer -= dt;
          if (countdownTimer <= 0) {
            countdownValue--;
            if (countdownValue > 0) {
              document.getElementById("countdown").innerText =
                countdownValue.toString();
              Sound.playBeep(440); // Countdown beep
              countdownTimer = 1;
            } else if (countdownValue === 0) {
              document.getElementById("countdown").innerText = "GO!";
              document.getElementById("countdown").style.color = "#00FF00";
              Sound.playBeep(880); // Higher pitch for GO
              Sound.startMusic();
              Sound.startEngine();
              countdownTimer = 0.5;
            } else {
              document.getElementById("countdown").style.display = "none";
              document.getElementById("countdown").style.color = "";
              countdownActive = false;
              raceStarted = true;
              gameTime = 0;
            }
          }
          return; // Don't update game while counting down
        }

        gameTime += dt;
        document.getElementById("timeVal").innerText = gameTime.toFixed(2);
        updateRaceClock(dt);
        if (raceFinished) return;

        // Distance pays as you drive.
        score += speed * dt * SCORE_PER_UNIT;

        if (isCrashed) {
          crashTimer -= dt;
          if (crashTimer <= 0) {
            isCrashed = false;
            document.getElementById("message").style.display = "none";
            speed = 2000;
            Sound.startEngine();
          }
        }

        let playerSegment = findSegment(playerZ);

        for (let n = 0; n < cars.length; n++) {
          let car = cars[n];
          let oldSegment = findSegment(car.z);
          car.z += car.speed * dt;
          if (car.z >= segments.length * SEGMENT_LENGTH)
            car.z -= segments.length * SEGMENT_LENGTH;
          let newSegment = findSegment(car.z);

          if (oldSegment != newSegment) {
            let index = oldSegment.cars.indexOf(car);
            oldSegment.cars.splice(index, 1);
            newSegment.cars.push(car);
          }

          if (!isCrashed) {
            if (
              playerZ > car.z - SEGMENT_LENGTH &&
              playerZ < car.z + SEGMENT_LENGTH
            ) {
              // Reduced hitbox width from 0.8 to 0.4 for tighter collision
              if (overlap(playerX, 0.4, car.offset, 0.4, 1.0)) {
                crash(car);
              }
            }
          }
        }

        if (!isCrashed) {
          keyLeft = Arcade.Input.held("left");
          keyRight = Arcade.Input.held("right");
          keyFaster = Arcade.Input.held("up");
          keySlower = Arcade.Input.held("down");

          if (keyFaster) speed = speed + accel * dt;
          else if (keySlower) speed = speed + breaking * dt;
          else speed = speed + decel * dt;

          if (keyLeft) playerX = playerX - 5.0 * dt * (speed / maxSpeed);
          if (keyRight) playerX = playerX + 5.0 * dt * (speed / maxSpeed);

          playerX =
            playerX - 0.3 * dt * (speed / maxSpeed) * playerSegment.curve * 2;

          playerX = Math.max(-2.5, Math.min(playerX, 2.5));

          if (playerX < -1 || playerX > 1) {
            if (speed > offRoadLimit) speed = speed + offRoadDecel * dt;
          }

          playerZ = playerZ + speed * dt;
          speed = Math.max(0, Math.min(speed, maxSpeed));

          const trackLength = segments.length * SEGMENT_LENGTH;

          // Lap crossing detection
          if (playerZ >= trackLength) {
            playerZ -= trackLength;

            // Record lap time
            playerLapTimes.push(gameTime);
            if (playerBestLap === null || gameTime < playerBestLap) {
              playerBestLap = gameTime;
            }

            playerLap++;
            score += LAP_BONUS;

            if (playerLap > TOTAL_LAPS) {
              finishRace("finish");
            } else {
              // Getting round buys you more clock.
              raceTime += LAP_EXTENSION;
              Sound.playBeep(880);

              // Show lap complete message briefly
              document.getElementById("countdown").style.display = "block";
              document.getElementById("countdown").innerText =
                "LAP " + (playerLap - 1) + ": " + gameTime.toFixed(2);
              setTimeout(() => {
                document.getElementById("countdown").style.display = "none";
              }, 2000);
              gameTime = 0; // Reset lap timer
            }
          } else if (playerZ < 0) {
            playerZ += trackLength;
          }
        }

        updateHud();
      }

      function findSegment(z) {
        return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length];
      }

      function frame() {
        let now = new Date().getTime();
        let dt = Math.min(1, (now - lastTime) / 1000);
        lastTime = now;

        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        ctx.fillStyle = "#0a3a41";
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#003300";
        ctx.fillRect(0, height / 2, width, height / 2);

        if (!gameRunning) return;

        let baseSegment = findSegment(playerZ);
        let basePercent = percentRemaining(playerZ, SEGMENT_LENGTH);

        let dx = -(baseSegment.curve * basePercent);
        let x = 0;
        let maxY = height; // Clipping buffer: anything below this Y is already drawn

        const cameraDepth = 1 / Math.tan(((FIELD_OF_VIEW / 2) * Math.PI) / 180);
        let playerY = interpolate(
          baseSegment.p1.world.y,
          baseSegment.p2.world.y,
          basePercent
        );
        let trackLength = segments.length * SEGMENT_LENGTH;
        let carsToDraw = []; // Collect cars for deferred rendering

        for (let n = 0; n < DRAW_DISTANCE; n++) {
          let segment = segments[(baseSegment.index + n) % segments.length];
          let looped = segment.index < baseSegment.index;

          let cameraX = playerX * ROAD_WIDTH;
          let cameraY = CAMERA_HEIGHT + playerY;
          let cameraZ = playerZ - (looped ? trackLength : 0);

          // Apply curve offset to segment world positions
          segment.p1.world.x = x;
          segment.p2.world.x = x + dx;

          project(
            segment.p1,
            cameraX,
            cameraY,
            cameraZ,
            cameraDepth,
            width,
            height,
            ROAD_WIDTH
          );
          project(
            segment.p2,
            cameraX,
            cameraY,
            cameraZ,
            cameraDepth,
            width,
            height,
            ROAD_WIDTH
          );

          x += dx;
          dx += segment.curve;

          // Special check for segment 0: if p1 is behind camera, force it to bottom
          // This prevents flickering gaps at the bottom of the screen
          if (n === 0 && segment.p1.camera.z <= cameraDepth) {
            segment.p1.screen.y = height;
            segment.p1.screen.x = segment.p2.screen.x;
            segment.p1.screen.w = segment.p2.screen.w * 6;
          }

          // Standard Near Plane Clip
          if (segment.p1.camera.z <= cameraDepth && n > 0) continue;

          // Horizon / Hill Occlusion Clip:
          // In front-to-back rendering, we track the highest point (lowest Y) drawn so far.
          // If the current segment's TOP (p2) is BELOW (higher Y) the current horizon (maxY), then the segment is fully obscured by a hill.
          if (segment.p2.screen.y >= maxY) continue;

          // If the segment is visible, draw it.
          renderSegment(segment);

          // Update Horizon to the new top-most edge
          maxY = segment.p2.screen.y;

          // Collect car data for deferred rendering
          for (let i = 0; i < segment.cars.length; i++) {
            let car = segment.cars[i];
            let spriteScale = interpolate(
              segment.p1.screen.scale,
              segment.p2.screen.scale,
              0.5
            );
            // Skip cars with no/negative scale
            if (spriteScale <= 0) continue;

            let spriteX =
              interpolate(segment.p1.screen.x, segment.p2.screen.x, 0.5) +
              (spriteScale * car.offset * ROAD_WIDTH * width) / 2;
            let spriteY = interpolate(
              segment.p1.screen.y,
              segment.p2.screen.y,
              0.5
            );
            // Store for deferred render
            carsToDraw.push({
              x: spriteX,
              y: spriteY,
              scale: spriteScale * 6000,
              color: car.color,
            });
          }
        }

        // Render cars back-to-front (furthest first)
        for (let i = carsToDraw.length - 1; i >= 0; i--) {
          let c = carsToDraw[i];
          renderCar(c.x, c.y, c.scale, c.color);
        }

        if (!isCrashed || Math.floor(Date.now() / 200) % 2 == 0) {
          renderPlayer();
        }

        if (isCrashed) {
          ctx.fillStyle = `rgba(255, ${Math.floor(
            Math.random() * 150
          )}, 0, 0.8)`;
          ctx.beginPath();
          ctx.arc(
            width / 2,
            height - 150,
            60 + Math.random() * 40,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      function renderSegment(segment) {
        let x1 = segment.p1.screen.x;
        let y1 = segment.p1.screen.y;
        let w1 = segment.p1.screen.w;
        let x2 = segment.p2.screen.x;
        let y2 = segment.p2.screen.y;
        let w2 = segment.p2.screen.w;

        let r1 = w1 / Math.max(6, 2 * LANES);
        let r2 = w2 / Math.max(6, 2 * LANES);
        let l1 = w1 / Math.max(32, 2 * LANES);
        let l2 = w2 / Math.max(32, 2 * LANES);

        ctx.fillStyle = segment.color.grass;
        ctx.fillRect(0, y2, width, y1 - y2);

        renderPolygon(
          x1 - w1 - r1,
          y1,
          x1 - w1,
          y1,
          x2 - w2,
          y2,
          x2 - w2 - r2,
          y2,
          segment.color.rumble
        );
        renderPolygon(
          x1 + w1 + r1,
          y1,
          x1 + w1,
          y1,
          x2 + w2,
          y2,
          x2 + w2 + r2,
          y2,
          segment.color.rumble
        );
        renderPolygon(
          x1 - w1,
          y1,
          x1 + w1,
          y1,
          x2 + w2,
          y2,
          x2 - w2,
          y2,
          segment.color.road
        );

        if (segment.color.lane) {
          let laneW1 = (w1 * 2) / LANES;
          let laneW2 = (w2 * 2) / LANES;
          let laneX1 = x1 - w1 + laneW1;
          let laneX2 = x2 - w2 + laneW2;

          for (let lane = 1; lane < LANES; lane++) {
            renderPolygon(
              laneX1 - l1 / 2,
              y1,
              laneX1 + l1 / 2,
              y1,
              laneX2 + l2 / 2,
              y2,
              laneX2 - l2 / 2,
              y2,
              segment.color.lane
            );
            laneX1 += laneW1;
            laneX2 += laneW2;
          }
        }
      }

      function renderPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.lineTo(x4, y4);
        ctx.closePath();
        ctx.fill();
      }

      function renderCar(x, y, scale, color) {
        // Skip if off screen or behind camera
        if (y < 0 || y > height || scale <= 0) return;

        // Match player car proportions (player: w=180, h=80 at full size)
        const s = scale;
        const carW = Math.max(20, 80 * s);
        const carH = Math.max(10, 40 * s);

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(
          x - carW / 2 + carW * 0.1,
          y - carH * 0.1,
          carW * 0.8,
          carH * 0.2
        );

        // Main body (like player car shape)
        ctx.fillStyle = color;
        ctx.fillRect(
          x - carW / 2 - carW * 0.05,
          y - carH * 0.75,
          carW * 1.1,
          carH * 0.25
        ); // rear wing
        ctx.fillRect(x - carW * 0.25, y - carH, carW * 0.5, carH); // main body
        ctx.fillRect(
          x - carW * 0.15,
          y - carH - carH * 0.25,
          carW * 0.3,
          carH * 0.25
        ); // cockpit

        // Wheels (black)
        ctx.fillStyle = "#222";
        const wheelW = Math.max(4, carW * 0.15);
        const wheelH = Math.max(6, carH * 0.6);
        ctx.fillRect(
          x - carW / 2 - wheelW * 0.6,
          y - carH * 0.6,
          wheelW,
          wheelH
        );
        ctx.fillRect(
          x + carW / 2 - wheelW * 0.4,
          y - carH * 0.6,
          wheelW,
          wheelH
        );

        // Driver helmet
        ctx.fillStyle = "#FFFF00";
        const helmetR = Math.max(2, carH * 0.15);
        ctx.beginPath();
        ctx.arc(x, y - carH * 0.75, helmetR, 0, Math.PI * 2);
        ctx.fill();
      }

      function renderPlayer() {
        const carX = width / 2;
        const carY = height - 120;
        const carW = 180;
        const carH = 80;

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(carX - carW / 2 + 20, carY + carH - 10, carW - 40, 20);

        ctx.fillStyle = "#FF0000";
        ctx.fillRect(carX - carW / 2 - 10, carY + 20, carW + 20, 20);
        ctx.fillRect(carX - 40, carY, 80, carH);
        ctx.fillRect(carX - 20, carY - 20, 40, 20);

        ctx.fillStyle = "#222";
        ctx.fillRect(carX - carW / 2 - 20, carY + 30, 30, 50);
        ctx.fillRect(carX + carW / 2 - 10, carY + 30, 30, 50);

        ctx.fillStyle = "#FFFF00";
        ctx.beginPath();
        ctx.arc(carX, carY + 20, 14, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- AUDIO SYSTEM ---
      // --- AUDIO (shared module) ---
      const Sound = {
        engineOsc: null,
        engineGain: null,

        // Unlike the old one-shot schedule, this loop can be stopped.
        music: Arcade.Audio.loop({
          notes: [110, 110, 130, 110, 146, 130, 110, 98], // A2-ish bass line
          tempo: 150,
          type: "square",
          volume: 0.1,
          noteDuration: 0.13,
        }),

        init: function () {
          Arcade.Audio.context();
        },

        playBeep: function (freq) {
          Arcade.Audio.tone(freq || 440, {
            duration: 0.3,
            type: "sine",
            volume: 0.3,
          });
        },

        startMusic: function () {
          this.music.start();
        },

        stopMusic: function () {
          this.music.stop();
        },

        // A sustained drone whose pitch tracks speed - its own graph, but
        // routed through the shared mute knob.
        startEngine: function () {
          const ctxA = Arcade.Audio.context();
          if (!ctxA || this.engineOsc) return; // already idling

          this.engineOsc = ctxA.createOscillator();
          this.engineOsc.type = "sawtooth";
          this.engineGain = ctxA.createGain();
          this.engineGain.gain.value = 0.05;

          // Low pass filter to muffle the harsh saw wave
          const filter = ctxA.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 400;

          this.engineOsc.connect(filter);
          filter.connect(this.engineGain);
          this.engineGain.connect(Arcade.Audio.output());
          this.engineOsc.start();
        },

        stopEngine: function () {
          if (this.engineOsc) {
            this.engineOsc.stop();
            this.engineOsc.disconnect();
            this.engineOsc = null;
          }
          if (this.engineGain) {
            this.engineGain.disconnect();
            this.engineGain = null;
          }
        },

        updateEngine: function (speedPercent) {
          if (!this.engineOsc) return;
          // Pitch from 60Hz (idle) to 200Hz (max)
          const ctxA = Arcade.Audio.context();
          this.engineOsc.frequency.setTargetAtTime(
            60 + speedPercent * 140,
            ctxA.currentTime,
            0.1
          );
          // Slight wobble for "purr"
          this.engineGain.gain.value = 0.05 + Math.random() * 0.01;
        },

        playCrash: function () {
          Arcade.Audio.noise({
            duration: 0.5,
            volume: 0.3,
            filterFrom: 1200,
            filterTo: 200,
          });
        },
      };

      function updateHud() {
        document.getElementById("speedVal").innerText = Math.floor(speed / 100);
        document.getElementById("scoreVal").innerText = Math.floor(score);
        document.getElementById("lapVal").innerText = Math.min(
          playerLap,
          TOTAL_LAPS
        );
        if (playerBestLap !== null) {
          document.getElementById("bestVal").innerText =
            playerBestLap.toFixed(2);
        }
      }

      // Update Init to allow audio context start
      Arcade.Shell.init({
        game: GAME_KEY,
        onPause: () => Sound.stopEngine(),
        onResume: () => {
          if (raceStarted && !raceFinished && !isCrashed) Sound.startEngine();
        },
      });

      renderScores();
      window.onload = function () {
        init();
        Arcade.Shell.fit("#game-container");
      };

      // Hook up Engine Sound in Update
      const originalUpdate = update;
      update = function (dt) {
        originalUpdate(dt);
        if (gameRunning && raceStarted && !isCrashed && !raceFinished) {
          Sound.updateEngine(speed / maxSpeed);
        }
      };

      // Hook up Crash Sound
      const originalCrash = crash;
      crash = function (car) {
        if (!isCrashed) {
          // Only play if not already crashed
          Sound.playCrash();
          Sound.stopEngine(); // update() restarts it when the wreck clears
        }
        originalCrash(car);
      };
    </script>
  </body>
</html>
