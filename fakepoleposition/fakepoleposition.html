<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Pole Position</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --neon-pink: #ff00ff;
        --neon-blue: #00ffff;
        --neon-green: #00ff00;
        --neon-purple: #bd00ff;
        --neon-red: #ff3333;
        --neon-orange: #ff6600;
        --bg-color: #050505;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: #fff;
        font-family: "Press Start 2P", monospace;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* CRT Effect Overlay */
      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
          ),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.06)
          );
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 10;
        animation: flicker 0.15s infinite;
      }

      .crt-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        z-index: 9;
      }

      @keyframes flicker {
        0% {
          opacity: 0.9;
        }
        5% {
          opacity: 0.85;
        }
        10% {
          opacity: 0.9;
        }
        15% {
          opacity: 1;
        }
        20% {
          opacity: 0.9;
        }
        25% {
          opacity: 0.85;
        }
        100% {
          opacity: 0.9;
        }
      }

      #game-container {
        position: relative;
        border: 4px solid #333;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px var(--neon-orange);
      }

      canvas {
        display: block;
        background-color: #000;
        image-rendering: pixelated; /* Essential for retro look */
      }

      .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        z-index: 5;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        width: 100%;
        text-shadow: 2px 2px #000;
        font-size: 20px;
        color: #fff;
      }

      .hud-score {
        color: var(--neon-blue);
      }
      .hud-time {
        color: var(--neon-green);
      }
      .hud-best {
        color: var(--neon-orange);
      }
      .hud-speed {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: var(--neon-red);
        font-size: 24px;
        text-align: right;
      }

      .countdown-clock {
        position: absolute;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 56px;
        color: var(--neon-green);
        text-shadow: 4px 4px 0 #000, 0 0 24px var(--neon-green);
        font-variant-numeric: tabular-nums;
      }

      .countdown-clock.low {
        color: var(--neon-red);
        text-shadow: 4px 4px 0 #000, 0 0 24px var(--neon-red);
        animation: pulse 0.5s infinite;
      }

      .center-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        color: var(--neon-red);
        text-shadow: 4px 4px 0 #000;
        display: none;
        text-transform: uppercase;
        animation: pulse 0.5s infinite;
      }

      .countdown {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        color: var(--neon-green);
        text-shadow: 6px 6px 0 #000, 0 0 40px var(--neon-green);
        display: none;
        z-index: 25;
      }

      @keyframes pulse {
        0% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      .start-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      h1 {
        font-size: 48px;
        color: var(--neon-orange);
        text-shadow: 4px 4px var(--neon-purple);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-align: center;
      }

      .press-start {
        font-size: 24px;
        color: #fff;
        animation: blink 1s infinite;
        margin-top: 40px;
        cursor: pointer;
        pointer-events: auto;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .controls-hint {
        margin-top: 60px;
        font-family: "Share Tech Mono", monospace;
        color: #aaa;
        font-size: 16px;
        text-align: center;
        line-height: 1.5;
      }

      .key {
        display: inline-block;
        border: 1px solid #777;
        border-radius: 4px;
        padding: 2px 6px;
        background: #222;
        color: #fff;
        margin: 0 2px;
        font-size: 12px;
      }

      .results {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px 48px;
        background: rgba(0, 0, 0, 0.85);
        border: 3px solid var(--neon-orange);
        box-shadow: 0 0 30px var(--neon-orange);
        z-index: 25;
        pointer-events: auto;
      }

      .results h2 {
        margin: 0;
        font-size: 32px;
        color: var(--neon-orange);
        letter-spacing: 4px;
      }

      .result-rows {
        font-family: "Share Tech Mono", monospace;
        font-size: 18px;
        color: #fff;
        line-height: 1.8;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .result-best {
        font-size: 16px;
        color: var(--neon-green);
        letter-spacing: 2px;
      }

      .result-restart {
        font-size: 14px;
        color: #fff;
        animation: blink 1s infinite;
        letter-spacing: 2px;
      }

    </style>
    <link rel="stylesheet" href="../arcade/arcade.css" />
  </head>
  <body>
    <div class="crt-overlay"></div>
    <div class="crt-glow"></div>

    <div id="game-container">
      <canvas id="gameCanvas" width="1024" height="768"></canvas>

      <div class="ui-layer" id="gameUI">
        <div class="hud-top">
          <div class="hud-score">LAP <span id="lapVal">1</span>/3</div>
          <div class="hud-time">LAP TIME <span id="timeVal">0.00</span></div>
          <div class="hud-score">SCORE <span id="scoreVal">0</span></div>
          <div class="hud-best">BEST <span id="bestVal">--</span></div>
        </div>
        <div class="center-message" id="message">CRASH!</div>
        <div class="countdown" id="countdown"></div>
        <div class="countdown-clock" id="raceClock">90</div>
        <div class="hud-speed"><span id="speedVal">0</span> km/h</div>
        <div class="results" id="results"></div>
      </div>

      <div class="start-screen" id="startScreen">
        <h1>FAKE POLE POSITION</h1>
        <div class="press-start" onclick="startGame()">
          INSERT COIN TO START
        </div>

        <pre id="highScores" style="color: #ff0; font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 1.6; margin-top: 24px"></pre>

        <div class="controls-hint">
          <span class="key">↑</span> ACCELERATE &nbsp;
          <span class="key">↓</span> BRAKE <br />
          <span class="key">←</span> LEFT &nbsp;
          <span class="key">→</span> RIGHT <br /><br />
          <span class="key">P</span> PAUSE &nbsp;
          <span class="key">M</span> MUTE &nbsp;
          <span class="key">ESC</span> ARCADE
        </div>
      </div>
    </div>

    <script src="../arcade/audio.js"></script>
    <script src="../arcade/input.js"></script>
    <script src="../arcade/scores.js"></script>
    <script src="../arcade/shell.js"></script>
    <script>
      // Game Constants
      const FPS = 60;
      const STEP = 1 / FPS;
      const ROAD_WIDTH = 2000;
      const SEGMENT_LENGTH = 200;
      const RUMBLE_LENGTH = 3;
      const LANES = 3;
      const FIELD_OF_VIEW = 100;
      const CAMERA_HEIGHT = 1000;
      const DRAW_DISTANCE = 300;
      const FOG_DENSITY = 5;
      const NUM_CARS = 5;
      const CAMERA_DEPTH = 1 / Math.tan(((FIELD_OF_VIEW / 2) * Math.PI) / 180);

      // Every car is the same pixel-art sprite, CAR_MAP_W x CAR_MAP_H sprite
      // pixels, seen from behind. See the car sprites section.
      const CAR_MAP_W = 44;
      const CAR_MAP_H = 20;
      const PLAYER_PIXEL = 5; // screen pixels per sprite pixel for the player

      // Collision is measured against the pictures, so these describe what
      // renderPlayer and renderCar actually draw.
      //
      // The player's car is fixed on screen, in pixels up from the bottom of
      // the canvas: `bottom` is where its rear wheels meet the road, `top` its
      // highest point, `halfWidth` half its width across the wheels.
      const PLAYER_SPRITE = {
        bottom: 40,
        top: 40 + CAR_MAP_H * PLAYER_PIXEL,
        halfWidth: (CAR_MAP_W * PLAYER_PIXEL) / 2,
      };
      // AI cars are drawn at one screen pixel per sprite pixel per unit of
      // sprite scale, so at scale 1 they are half the map wide.
      const CAR_SPRITE_HALF_W = CAR_MAP_W / 2;
      // Roadside scenery keeps its own scale; it has nothing to match.
      const SCENERY_SCALE = 6000;

      // Colors. Kerbs alternate red and white; grass comes in two stripes.
      const COLORS = {
        FOG: "#c4dcec",
        LIGHT: {
          road: "#6e6e72",
          grass: "#46b03c",
          rumble: "#f2f2f2",
          lane: "#eeeeee",
        },
        DARK: { road: "#68686c", grass: "#3a9e33", rumble: "#d8231e" },
      };
      const SKY_TOP = "#2c7bd6";
      const SKY_HORIZON = "#b9e0fb";

      // Game State
      let canvas, ctx;
      let width = 1024;
      let height = 768;
      let segments = [];
      let cars = [];

      let playerX = 0;
      let playerZ = 0;
      let speed = 0;
      let maxSpeed = 12000;
      let accel = maxSpeed / 5;
      let breaking = -maxSpeed;
      let decel = -maxSpeed / 5;
      let offRoadDecel = -maxSpeed / 2;
      let offRoadLimit = maxSpeed / 4;

      let gameTime = 0;
      let isCrashed = false;
      let crashTimer = 0;
      let raceFinished = false;

      // Countdown state
      let countdownActive = false;
      let countdownValue = 3;
      let countdownTimer = 0;
      let raceStarted = false;

      // Lap tracking
      /* ------------------------------------------------ the countdown ---
       *
       * Pole Position is a race against a clock, not just against cars. You
       * start with a fixed number of seconds and buy more by getting round the
       * lap. Run out and the game ends where you stand - which is a different
       * ending from crossing the line, and gets a different panel.
       *
       * Laps stay as the win condition, which is how the arcade works too: the
       * clock can end you early, but finishing the distance is what wins.
       */
      const RACE_START_TIME = 90; // seconds on the clock at the green flag
      const LAP_EXTENSION = 30; // seconds bought by getting round
      const LOW_TIME_WARNING = 10;

      // Scoring, which this cabinet has never had. Distance pays as you drive,
      // laps pay a lump, and whatever is left on the clock pays out at the end.
      const SCORE_PER_UNIT = 0.0006;
      const LAP_BONUS = 1000;
      const TIME_BONUS_PER_SEC = 200;

      const GAME_KEY = "poleposition";
      let raceTime = RACE_START_TIME;
      let score = 0;
      let finishReason = "finish"; // or "timeup"

      const TOTAL_LAPS = 3;
      let playerLap = 1;
      let playerLapTimes = [];
      let playerBestLap = null;
      let playerLastZ = 0;

      let keyLeft = false;
      let keyRight = false;
      let keyFaster = false;
      let keySlower = false;

      let gameRunning = false;
      let lastTime = 0;

      // How far the backdrop has slid sideways, as a fraction of its width.
      // Curves push it; each layer moves at its own rate for parallax.
      let bgOffset = 0;
      const BG_SLIDE = 0.0012;
      let backdrop = null;

      // Utility Functions
      function easeIn(a, b, percent) {
        return a + (b - a) * Math.pow(percent, 2);
      }
      function easeOut(a, b, percent) {
        return a + (b - a) * (1 - Math.pow(1 - percent, 2));
      }
      function easeInOut(a, b, percent) {
        return a + (b - a) * (-Math.cos(percent * Math.PI) / 2 + 0.5);
      }
      function percentRemaining(n, total) {
        return (n % total) / total;
      }
      function interpolate(a, b, percent) {
        return a + (b - a) * percent;
      }
      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      function project(
        p,
        cameraX,
        cameraY,
        cameraZ,
        cameraDepth,
        width,
        height,
        roadWidth
      ) {
        p.camera.x = (p.world.x || 0) - cameraX;
        p.camera.y = (p.world.y || 0) - cameraY;
        p.camera.z = (p.world.z || 0) - cameraZ;

        if (p.camera.z < 1) {
          p.screen.scale = 0;
        } else {
          p.screen.scale = cameraDepth / p.camera.z;
        }

        p.screen.x = Math.round(
          width / 2 + (p.screen.scale * p.camera.x * width) / 2
        );
        p.screen.y = Math.round(
          height / 2 - (p.screen.scale * p.camera.y * height) / 2
        );
        p.screen.w = Math.round((p.screen.scale * roadWidth * width) / 2);
      }

      /* ------------------------------------------------------ collision ---
       *
       * The camera is not where the player's car is. The car is drawn near the
       * bottom of the screen, about a thousand units up the road from the
       * camera, so every distance here is measured from there. The old check
       * measured from the camera, which meant you hit cars once they had
       * already slid out of the bottom of the view.
       *
       * Known ceiling: depths are worked out for flat road. On the crest of
       * the one hill they are slightly off.
       */

      /** How far up the road a point on flat ground must be to land on row y. */
      function depthAtScreenY(y) {
        return (CAMERA_DEPTH * CAMERA_HEIGHT * (height / 2)) / (y - height / 2);
      }

      /** Screen pixels per road unit (half the road's width) at depth z. */
      function roadUnitPx(z) {
        return (CAMERA_DEPTH / z) * ROAD_WIDTH * (width / 2);
      }

      function playerRearZ() {
        return depthAtScreenY(height - PLAYER_SPRITE.bottom);
      }

      /**
       * AI cars are drawn at projected scale x this. It is chosen so a car
       * level with the player's rear wheels is exactly as wide as the
       * player's car, so the whole field is the same size.
       */
      function carSpriteScale() {
        return (PLAYER_SPRITE.halfWidth * playerRearZ()) / (CAR_SPRITE_HALF_W * CAMERA_DEPTH);
      }

      /** Nose to tail, in road depth. AI cars are treated as the same length. */
      function carLength() {
        return depthAtScreenY(height - PLAYER_SPRITE.top) - playerRearZ();
      }

      /** Distance from the player's rear wheels to where a car is drawn. */
      function gapTo(car) {
        const track = segments.length * SEGMENT_LENGTH;
        // render() draws a car at the middle of its segment, so measure that.
        const drawnZ = Math.floor(car.z / SEGMENT_LENGTH) * SEGMENT_LENGTH + SEGMENT_LENGTH / 2;
        let gap = (drawnZ - (playerZ + playerRearZ())) % track;
        if (gap > track / 2) gap -= track;
        if (gap < -track / 2) gap += track;
        return gap;
      }

      /**
       * Whether the two cars overlap sideways, judged at the depth the other
       * car is drawn. The player's sprite does not scale with depth, so its
       * width in road units depends on where you measure it.
       */
      function sideBySide(car, gap) {
        const depth = playerRearZ() + Math.max(0, gap);
        const reach =
          PLAYER_SPRITE.halfWidth / roadUnitPx(depth) +
          (CAR_SPRITE_HALF_W * carSpriteScale()) / (ROAD_WIDTH * (width / 2));
        return Math.abs(playerX - car.offset) < reach;
      }

      function collides(car) {
        const gap = gapTo(car);
        return Math.abs(gap) < carLength() && sideBySide(car, gap);
      }

      /** A long frame can carry the player from clear ahead to clear behind. */
      function passedThrough(car, gapBefore) {
        const length = carLength();
        return gapBefore >= length && gapTo(car) <= -length && sideBySide(car, 0);
      }

      function init() {
        canvas = document.getElementById("gameCanvas");
        ctx = canvas.getContext("2d");
        width = canvas.width;
        height = canvas.height;

        // Event Listeners
        // Steering is polled from Arcade.Input every frame; only the restart
        // needs a press edge of its own.
        document.addEventListener("keydown", function (e) {
          if (raceFinished && (e.key === "r" || e.key === "R")) startGame();
        });

        requestAnimationFrame(frame);
      }

      function addSegment(curve, y) {
        let n = segments.length;
        segments.push({
          index: n,
          p1: {
            world: { z: n * SEGMENT_LENGTH, y: lastY(), x: 0 },
            camera: {},
            screen: {},
          },
          p2: {
            world: { z: (n + 1) * SEGMENT_LENGTH, y: y, x: 0 },
            camera: {},
            screen: {},
          },
          curve: curve,
          cars: [],
          sprites: [],
          color: Math.floor(n / RUMBLE_LENGTH) % 2 ? COLORS.DARK : COLORS.LIGHT,
        });
      }

      function lastY() {
        return segments.length === 0
          ? 0
          : segments[segments.length - 1].p2.world.y;
      }

      function resetRoad() {
        segments = [];
        const NUM_SEGMENTS = 2000;

        for (let n = 0; n < NUM_SEGMENTS; n++) {
          let curve = 0;
          let y = 0;

          if (n > 200 && n < 400) curve = 4;
          if (n > 800 && n < 1200) curve = -4;
          if (n > 1500 && n < 1700) curve = 3;

          if (n > 500 && n < 700) {
            let range = 200;
            let i = n - 500;
            y = Math.sin((i / range) * Math.PI) * 1500;
          }

          addSegment(curve, y);
        }
        // The lap counts when the camera wraps, and at that moment the
        // player's car is sitting on this segment - so that is where the
        // line goes. It is also where the car starts the race.
        segments[Math.floor(playerRearZ() / SEGMENT_LENGTH)].checker = true;
        placeScenery();

        cars = [];
        for (let i = 0; i < NUM_CARS; i++) {
          let offset =
            Math.random() *
            randomInt(0.4, 0.8) *
            (Math.random() > 0.5 ? 1 : -1);
          // Spawn cars closer to player - spread across segments 20-300
          let z = Math.floor(20 + i * 60 + Math.random() * 40) * SEGMENT_LENGTH;
          let speed = maxSpeed / 2 + Math.random() * (maxSpeed / 3);
          let car = {
            offset: offset,
            z: z,
            speed: speed,
            color: ["#0000FF", "#00FF00", "#FFFF00", "#FFFFFF", "#00FFFF"][
              i % 5
            ],
          };
          cars.push(car);
          let segment = findSegment(car.z);
          segment.cars.push(car);
        }

        playerX = 0;
        playerZ = 0;
        speed = 0;
        isCrashed = false;
        gameTime = 0;
      }

      function startGame() {
        document.getElementById("startScreen").style.display = "none";
        gameRunning = true;
        raceStarted = false;
        raceFinished = false;
        Sound.stopEngine();
        document.getElementById("results").style.display = "none";
        document.getElementById("message").style.display = "none";
        countdownActive = true;
        countdownValue = 3;
        countdownTimer = 1;
        playerLap = 1;
        raceTime = RACE_START_TIME;
        score = 0;
        finishReason = "finish";
        document.getElementById("raceClock").classList.remove("low");
        document.getElementById("raceClock").innerText = RACE_START_TIME;
        playerLapTimes = [];
        playerBestLap = null;
        playerLastZ = 0;
        resetRoad();
        Sound.init();

        // Show initial countdown
        document.getElementById("countdown").style.display = "block";
        document.getElementById("countdown").innerText = "3";
        Sound.playBeep(440); // First beep
      }

      // The track keeps rendering behind the results panel, so the race ends by
      // freezing the sim rather than by tearing the world down.
      /** `reason` is "finish" when the distance is done, "timeup" when it is not. */
      function finishRace(reason) {
        if (raceFinished) return;

        finishReason = reason || "finish";
        raceFinished = true;
        speed = 0;
        Sound.stopEngine();
        Sound.stopMusic();

        // Whatever is left on the clock only pays out if you got there.
        let timeBonus = 0;
        if (finishReason === "finish") {
          timeBonus = Math.floor(raceTime) * TIME_BONUS_PER_SEC;
          score += timeBonus;
        }
        updateHud();

        const won = finishReason === "finish";
        const rows = playerLapTimes
          .map((t, i) => "LAP " + (i + 1) + "&nbsp;&nbsp;" + t.toFixed(2))
          .join("<br />");
        const best = playerBestLap === null ? "--" : playerBestLap.toFixed(2);

        const results = document.getElementById("results");
        results.innerHTML =
          "<h2>" + (won ? "FINISH" : "TIME UP") + "</h2>" +
          '<div class="result-rows">' +
          (rows || "NO LAPS COMPLETED") +
          "</div>" +
          '<div class="result-best">BEST LAP ' + best + "</div>" +
          (timeBonus
            ? '<div class="result-best">TIME BONUS ' + timeBonus + "</div>"
            : "") +
          '<div class="result-best">SCORE ' + Math.floor(score) + "</div>" +
          '<div class="result-restart">PRESS R TO RACE AGAIN</div>';
        results.style.display = "flex";
        results.style.borderColor = won ? "var(--neon-orange)" : "var(--neon-red)";

        const total = Math.floor(score);
        if (Arcade.Scores.qualifies(GAME_KEY, total)) {
          Arcade.Scores.promptInitials(total, (initials) => {
            Arcade.Scores.submit(GAME_KEY, initials, total);
            renderScores();
          });
        }
        renderScores();
      }

      function renderScores() {
        const el = document.getElementById("highScores");
        if (el) el.textContent = Arcade.Scores.format(GAME_KEY);
      }

      /** Runs the race clock down and ends the game when it empties. */
      function updateRaceClock(dt) {
        raceTime -= dt;

        const clock = document.getElementById("raceClock");
        clock.innerText = Math.max(0, Math.ceil(raceTime));
        clock.classList.toggle("low", raceTime <= LOW_TIME_WARNING);

        if (raceTime <= 0) {
          raceTime = 0;
          finishRace("timeup");
        }
      }

      function crash(car) {
        if (isCrashed) return;
        isCrashed = true;
        speed = 0;
        crashTimer = 3;
        document.getElementById("message").style.display = "block";
        document.getElementById("message").innerText = "CRASH!";

        if (car) {
          car.z += 1000;
          car.speed += 500;
        }
      }

      function update(dt) {
        if (!gameRunning || raceFinished || Arcade.Shell.paused) return;

        // Handle countdown
        if (countdownActive) {
          countdownTimer -= dt;
          if (countdownTimer <= 0) {
            countdownValue--;
            if (countdownValue > 0) {
              document.getElementById("countdown").innerText =
                countdownValue.toString();
              Sound.playBeep(440); // Countdown beep
              countdownTimer = 1;
            } else if (countdownValue === 0) {
              document.getElementById("countdown").innerText = "GO!";
              document.getElementById("countdown").style.color = "#00FF00";
              Sound.playBeep(880); // Higher pitch for GO
              Sound.startMusic();
              Sound.startEngine();
              countdownTimer = 0.5;
            } else {
              document.getElementById("countdown").style.display = "none";
              document.getElementById("countdown").style.color = "";
              countdownActive = false;
              raceStarted = true;
              gameTime = 0;
            }
          }
          return; // Don't update game while counting down
        }

        gameTime += dt;
        document.getElementById("timeVal").innerText = gameTime.toFixed(2);
        updateRaceClock(dt);
        if (raceFinished) return;

        // Distance pays as you drive.
        score += speed * dt * SCORE_PER_UNIT;

        if (isCrashed) {
          crashTimer -= dt;
          if (crashTimer <= 0) {
            isCrashed = false;
            document.getElementById("message").style.display = "none";
            speed = 2000;
            Sound.startEngine();
          }
        }

        let playerSegment = findSegment(playerZ);
        const gapsBefore = cars.map(gapTo);
        bgOffset += playerSegment.curve * ((speed * dt) / SEGMENT_LENGTH) * BG_SLIDE;

        for (let n = 0; n < cars.length; n++) {
          let car = cars[n];
          let oldSegment = findSegment(car.z);
          car.z += car.speed * dt;
          if (car.z >= segments.length * SEGMENT_LENGTH)
            car.z -= segments.length * SEGMENT_LENGTH;
          let newSegment = findSegment(car.z);

          if (oldSegment != newSegment) {
            let index = oldSegment.cars.indexOf(car);
            oldSegment.cars.splice(index, 1);
            newSegment.cars.push(car);
          }
        }

        if (!isCrashed) {
          keyLeft = Arcade.Input.held("left");
          keyRight = Arcade.Input.held("right");
          keyFaster = Arcade.Input.held("up");
          keySlower = Arcade.Input.held("down");

          if (keyFaster) speed = speed + accel * dt;
          else if (keySlower) speed = speed + breaking * dt;
          else speed = speed + decel * dt;

          if (keyLeft) playerX = playerX - 5.0 * dt * (speed / maxSpeed);
          if (keyRight) playerX = playerX + 5.0 * dt * (speed / maxSpeed);

          playerX =
            playerX - 0.3 * dt * (speed / maxSpeed) * playerSegment.curve * 2;

          playerX = Math.max(-2.5, Math.min(playerX, 2.5));

          if (playerX < -1 || playerX > 1) {
            if (speed > offRoadLimit) speed = speed + offRoadDecel * dt;
          }

          playerZ = playerZ + speed * dt;
          speed = Math.max(0, Math.min(speed, maxSpeed));

          const trackLength = segments.length * SEGMENT_LENGTH;

          // Lap crossing detection
          if (playerZ >= trackLength) {
            playerZ -= trackLength;

            // Record lap time
            playerLapTimes.push(gameTime);
            if (playerBestLap === null || gameTime < playerBestLap) {
              playerBestLap = gameTime;
            }

            playerLap++;
            score += LAP_BONUS;

            if (playerLap > TOTAL_LAPS) {
              finishRace("finish");
            } else {
              // Getting round buys you more clock.
              raceTime += LAP_EXTENSION;
              Sound.playBeep(880);

              // Show lap complete message briefly
              document.getElementById("countdown").style.display = "block";
              document.getElementById("countdown").innerText =
                "LAP " + (playerLap - 1) + ": " + gameTime.toFixed(2);
              setTimeout(() => {
                document.getElementById("countdown").style.display = "none";
              }, 2000);
              gameTime = 0; // Reset lap timer
            }
          } else if (playerZ < 0) {
            playerZ += trackLength;
          }
        }

        // Both the cars and the player have moved, so this frame's positions
        // are the ones on screen.
        if (!isCrashed && !raceFinished) {
          for (let n = 0; n < cars.length; n++) {
            if (collides(cars[n]) || passedThrough(cars[n], gapsBefore[n])) {
              crash(cars[n]);
              break;
            }
          }
        }

        updateHud();
      }

      function findSegment(z) {
        return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length];
      }

      function frame() {
        let now = new Date().getTime();
        let dt = Math.min(1, (now - lastTime) / 1000);
        lastTime = now;

        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        renderBackdrop();

        if (!gameRunning) return;

        let baseSegment = findSegment(playerZ);
        let basePercent = percentRemaining(playerZ, SEGMENT_LENGTH);

        let dx = -(baseSegment.curve * basePercent);
        let x = 0;
        let maxY = height; // Clipping buffer: anything below this Y is already drawn

        const cameraDepth = CAMERA_DEPTH;
        let playerY = interpolate(
          baseSegment.p1.world.y,
          baseSegment.p2.world.y,
          basePercent
        );
        let trackLength = segments.length * SEGMENT_LENGTH;
        let carsToDraw = []; // Collect cars for deferred rendering

        for (let n = 0; n < DRAW_DISTANCE; n++) {
          let segment = segments[(baseSegment.index + n) % segments.length];
          let looped = segment.index < baseSegment.index;

          let cameraX = playerX * ROAD_WIDTH;
          let cameraY = CAMERA_HEIGHT + playerY;
          let cameraZ = playerZ - (looped ? trackLength : 0);

          // Apply curve offset to segment world positions
          segment.p1.world.x = x;
          segment.p2.world.x = x + dx;

          project(
            segment.p1,
            cameraX,
            cameraY,
            cameraZ,
            cameraDepth,
            width,
            height,
            ROAD_WIDTH
          );
          project(
            segment.p2,
            cameraX,
            cameraY,
            cameraZ,
            cameraDepth,
            width,
            height,
            ROAD_WIDTH
          );

          x += dx;
          dx += segment.curve;

          // Special check for segment 0: if p1 is behind camera, force it to bottom
          // This prevents flickering gaps at the bottom of the screen
          if (n === 0 && segment.p1.camera.z <= cameraDepth) {
            segment.p1.screen.y = height;
            segment.p1.screen.x = segment.p2.screen.x;
            segment.p1.screen.w = segment.p2.screen.w * 6;
          }

          // Standard Near Plane Clip
          if (segment.p1.camera.z <= cameraDepth && n > 0) continue;

          // Horizon / Hill Occlusion Clip:
          // In front-to-back rendering, we track the highest point (lowest Y) drawn so far.
          // If the current segment's TOP (p2) is BELOW (higher Y) the current horizon (maxY), then the segment is fully obscured by a hill.
          if (segment.p2.screen.y >= maxY) continue;

          // If the segment is visible, draw it.
          renderSegment(segment, n);

          // Update Horizon to the new top-most edge
          maxY = segment.p2.screen.y;

          // Collect car data for deferred rendering
          for (let i = 0; i < segment.cars.length; i++) {
            let car = segment.cars[i];
            let spriteScale = interpolate(
              segment.p1.screen.scale,
              segment.p2.screen.scale,
              0.5
            );
            // Skip cars with no/negative scale
            if (spriteScale <= 0) continue;

            let spriteX =
              interpolate(segment.p1.screen.x, segment.p2.screen.x, 0.5) +
              (spriteScale * car.offset * ROAD_WIDTH * width) / 2;
            let spriteY = interpolate(
              segment.p1.screen.y,
              segment.p2.screen.y,
              0.5
            );
            // Store for deferred render
            carsToDraw.push({
              x: spriteX,
              y: spriteY,
              scale: spriteScale * carSpriteScale(),
              color: car.color,
              lean: Math.sign(segment.curve), // they steer into the bend
              tread: Math.floor(car.z / TREAD_STEP) % 2,
            });
          }

          // Roadside scenery goes in the same list, so it sorts with the cars.
          const sceneryScale = interpolate(segment.p1.screen.scale, segment.p2.screen.scale, 0.5);
          if (sceneryScale > 0) {
            for (const item of segment.sprites) {
              carsToDraw.push({
                x:
                  interpolate(segment.p1.screen.x, segment.p2.screen.x, 0.5) +
                  (sceneryScale * item.offset * ROAD_WIDTH * width) / 2,
                y: interpolate(segment.p1.screen.y, segment.p2.screen.y, 0.5),
                scale: sceneryScale * SCENERY_SCALE,
                scenery: item,
              });
            }
          }
        }

        // Render cars and scenery back-to-front (furthest first)
        for (let i = carsToDraw.length - 1; i >= 0; i--) {
          let c = carsToDraw[i];
          if (c.scenery) renderScenery(c.scenery, c.x, c.y, c.scale);
          else renderCar(c.x, c.y, c.scale, c.color, c.lean, c.tread);
        }

        if (!isCrashed || Math.floor(Date.now() / 200) % 2 == 0) {
          renderPlayer();
        }

        if (isCrashed) {
          ctx.fillStyle = `rgba(255, ${Math.floor(
            Math.random() * 150
          )}, 0, 0.8)`;
          ctx.beginPath();
          ctx.arc(
            width / 2,
            height - 150,
            60 + Math.random() * 40,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      function renderSegment(segment, n) {
        let x1 = segment.p1.screen.x;
        let y1 = segment.p1.screen.y;
        let w1 = segment.p1.screen.w;
        let x2 = segment.p2.screen.x;
        let y2 = segment.p2.screen.y;
        let w2 = segment.p2.screen.w;

        let r1 = w1 / Math.max(6, 2 * LANES);
        let r2 = w2 / Math.max(6, 2 * LANES);
        let l1 = w1 / Math.max(32, 2 * LANES);
        let l2 = w2 / Math.max(32, 2 * LANES);

        ctx.fillStyle = segment.color.grass;
        ctx.fillRect(0, y2, width, y1 - y2);

        renderPolygon(
          x1 - w1 - r1,
          y1,
          x1 - w1,
          y1,
          x2 - w2,
          y2,
          x2 - w2 - r2,
          y2,
          segment.color.rumble
        );
        renderPolygon(
          x1 + w1 + r1,
          y1,
          x1 + w1,
          y1,
          x2 + w2,
          y2,
          x2 + w2 + r2,
          y2,
          segment.color.rumble
        );
        renderPolygon(
          x1 - w1,
          y1,
          x1 + w1,
          y1,
          x2 + w2,
          y2,
          x2 - w2,
          y2,
          segment.color.road
        );

        if (segment.color.lane) {
          let laneW1 = (w1 * 2) / LANES;
          let laneW2 = (w2 * 2) / LANES;
          let laneX1 = x1 - w1 + laneW1;
          let laneX2 = x2 - w2 + laneW2;

          for (let lane = 1; lane < LANES; lane++) {
            renderPolygon(
              laneX1 - l1 / 2,
              y1,
              laneX1 + l1 / 2,
              y1,
              laneX2 + l2 / 2,
              y2,
              laneX2 - l2 / 2,
              y2,
              segment.color.lane
            );
            laneX1 += laneW1;
            laneX2 += laneW2;
          }
        }

        if (segment.checker) renderChequers(x1, y1, w1, x2, y2, w2);

        // Haze thickens with distance and pales everything toward the sky.
        const haze = 1 - Math.exp(-Math.pow(n / DRAW_DISTANCE, 2) * FOG_DENSITY);
        if (haze > 0.02) {
          ctx.globalAlpha = haze;
          ctx.fillStyle = COLORS.FOG;
          ctx.fillRect(0, y2, width, y1 - y2);
          ctx.globalAlpha = 1;
        }
      }

      /** A two-row chequered band right across the road. */
      function renderChequers(x1, y1, w1, x2, y2, w2) {
        const COLS = 10;
        for (let row = 0; row < 2; row++) {
          const ta = row / 2, tb = (row + 1) / 2;
          const ya = interpolate(y1, y2, ta), yb = interpolate(y1, y2, tb);
          const xa = interpolate(x1, x2, ta), xb = interpolate(x1, x2, tb);
          const wa = interpolate(w1, w2, ta), wb = interpolate(w1, w2, tb);
          for (let col = 0; col < COLS; col++) {
            const fa = col / COLS, fb = (col + 1) / COLS;
            renderPolygon(
              xa - wa + 2 * wa * fa, ya,
              xa - wa + 2 * wa * fb, ya,
              xb - wb + 2 * wb * fb, yb,
              xb - wb + 2 * wb * fa, yb,
              (row + col) % 2 ? "#111111" : "#f4f4f4"
            );
          }
        }
      }

      function renderPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.lineTo(x4, y4);
        ctx.closePath();
        ctx.fill();
      }

      /* --------------------------------------------------- car sprites ---
       *
       * A 1982-style F1 car from behind: wide rear wing on pylons, fat rear
       * tyres, sidepods, an engine cover with a stripe, the driver's helmet,
       * exhausts and a tail light. It is a list of rectangles in sprite
       * pixels rather than a typed-out map - at 44 wide that is easier to get
       * right, and it makes the lean frames a matter of sliding the upper
       * parts sideways while the tyres stay planted.
       *
       * Each variant is drawn once into a small canvas and cached, then
       * scaled up with smoothing off so the pixels stay crisp.
       */
      const TREAD_STEP = 60; // road units per tread phase
      const TAIL_LIGHT = [21, 16]; // on the dark gearbox, so red shows on a red car

      const CAR_COLORS = {
        tyre: "#1c1c1e", tyreHi: "#46464c", tread: "#0a0a0c",
        metal: "#8a8f98", dark: "#2a2a2e", shadow: "rgba(0, 0, 0, 0.35)",
        helmet: "#ffd21e", helmetShade: "#c8980e", wingEnd: "#1a1a1a",
        sheen: "rgba(255, 255, 255, 0.28)",
        tailLight: "#7a1010", brakeLight: "#ff3030",
      };

      // The player plus one per AI colour; keys match the cars' `color`.
      const LIVERIES = {
        player: { body: "#e8201c", bodyDark: "#a0120e", stripe: "#ffffff" },
        "#0000FF": { body: "#1f4fd8", bodyDark: "#12308a", stripe: "#ffd21e" },
        "#00FF00": { body: "#1fa84a", bodyDark: "#127030", stripe: "#ffffff" },
        "#FFFF00": { body: "#f2c81e", bodyDark: "#b08a10", stripe: "#1a1a1a" },
        "#FFFFFF": { body: "#e8e8ec", bodyDark: "#a8a8b0", stripe: "#1f4fd8" },
        "#00FFFF": { body: "#1ec8d8", bodyDark: "#128a96", stripe: "#ffffff" },
      };

      /** [x, y, w, h, colour] rectangles, back to front, in sprite pixels. */
      function carParts(livery, lean, tread, brake) {
        const L = LIVERIES[livery];
        const C = CAR_COLORS;
        const up = lean * 2; // wing and helmet sit furthest forward, so swing most
        const mid = lean;
        const parts = [
          [3, 18, 38, 2, C.shadow],
          [0, 6, 8, 14, C.tyre], [36, 6, 8, 14, C.tyre],
          [1, 7, 1, 12, C.tyreHi], [37, 7, 1, 12, C.tyreHi],
        ];
        for (let y = 7 + tread; y < 19; y += 3) {
          parts.push([2, y, 5, 1, C.tread], [38, y, 5, 1, C.tread]);
        }
        parts.push(
          [8, 10, 3, 1, C.metal], [8, 15, 3, 1, C.metal], [33, 10, 3, 1, C.metal], [33, 15, 3, 1, C.metal],
          // Sidepods and engine cover, with rounded shoulders and a sheen.
          [11 + mid, 9, 22, 1, L.body], [10 + mid, 10, 24, 7, L.body], [10 + mid, 15, 24, 2, L.bodyDark],
          [11 + mid, 10, 22, 1, C.sheen],
          [18 + mid, 6, 8, 1, L.body], [17 + mid, 7, 10, 10, L.body], [18 + mid, 7, 8, 1, C.sheen],
          [21 + mid, 6, 2, 8, L.stripe],
          [18 + mid, 16, 8, 2, C.dark], [14 + mid, 16, 2, 2, C.metal], [28 + mid, 16, 2, 2, C.metal],
          [TAIL_LIGHT[0] + mid, TAIL_LIGHT[1], 2, 2, brake ? C.brakeLight : C.tailLight],
          [15 + up, 2, 1, 5, C.metal], [28 + up, 2, 1, 5, C.metal],
          // The back of the helmet: a rounded crown, shaded underneath.
          [20 + up, 3, 4, 1, C.helmet], [19 + up, 4, 6, 3, C.helmet], [19 + up, 6, 6, 1, C.helmetShade],
          [3 + up, 0, 38, 3, L.body], [3 + up, 1, 38, 1, L.stripe],
          [3 + up, 0, 2, 6, C.wingEnd], [39 + up, 0, 2, 6, C.wingEnd]
        );
        return parts;
      }

      const carSpriteCache = new Map();

      /** One variant of the car, drawn on first use and cached. */
      function carSprite(livery, lean, tread, brake) {
        const key = livery + "|" + lean + "|" + tread + "|" + brake;
        let sprite = carSpriteCache.get(key);
        if (!sprite) {
          sprite = document.createElement("canvas");
          sprite.width = CAR_MAP_W;
          sprite.height = CAR_MAP_H;
          const g = sprite.getContext("2d");
          for (const [x, y, w, h, color] of carParts(livery, lean, tread, brake)) {
            g.fillStyle = color;
            g.fillRect(x, y, w, h);
          }
          carSpriteCache.set(key, sprite);
        }
        return sprite;
      }

      /** Where an AI car drawn at (x, y) with this scale sits on screen. */
      function carBox(x, y, scale) {
        return { left: x - CAR_SPRITE_HALF_W * scale, right: x + CAR_SPRITE_HALF_W * scale, rearY: y };
      }

      function drawSprite(sprite, left, top, w, h) {
        // Crisp pixels, except for far-off cars smaller than the sprite
        // itself, which would only shimmer.
        ctx.imageSmoothingEnabled = w < CAR_MAP_W;
        ctx.drawImage(sprite, Math.round(left), Math.round(top), Math.round(w), Math.round(h));
        ctx.imageSmoothingEnabled = true;
      }

      function renderCar(x, y, scale, color, lean, tread) {
        if (y < 0 || y > height || scale <= 0) return;
        const box = carBox(x, y, scale);
        drawSprite(
          carSprite(color, lean || 0, tread || 0, false),
          box.left, y - CAR_MAP_H * scale, CAR_MAP_W * scale, CAR_MAP_H * scale
        );
      }

      /** Which frame the player's car shows: steering, braking, tyres rolling. */
      function playerCarFrame() {
        return {
          lean: keyLeft ? -1 : keyRight ? 1 : 0,
          brake: keySlower,
          tread: Math.floor(playerZ / TREAD_STEP) % 2,
        };
      }

      function renderPlayer() {
        const f = playerCarFrame();
        drawSprite(
          carSprite("player", f.lean, f.tread, f.brake),
          width / 2 - PLAYER_SPRITE.halfWidth,
          height - PLAYER_SPRITE.top,
          PLAYER_SPRITE.halfWidth * 2,
          PLAYER_SPRITE.top - PLAYER_SPRITE.bottom
        );
      }

      /* ------------------------------------------------------- scenery --- */

      /** Deterministic 0..1 noise, so the track looks the same every race. */
      function hash(a, b) {
        let h = Math.imul(a, 374761393) + Math.imul(b, 668265263);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
      }

      // Invented names only: these are billboards in a fake race.
      const BILLBOARDS = [
        { text: "ARCADE ZERO", panel: "#1b3fa0", ink: "#ffe14a" },
        { text: "TURBO OIL", panel: "#e8e8e8", ink: "#d8231e" },
        { text: "INSERT COIN", panel: "#d8231e", ink: "#ffffff" },
        { text: "FAKE COLA", panel: "#ffd21e", ink: "#1b1b1b" },
      ];

      /**
       * Scenery sits well off the tarmac: the kerb ends at about 1.17 road
       * units from the centre. It is decoration only; nothing collides with it.
       */
      function placeScenery() {
        const lineSeg = Math.floor(playerRearZ() / SEGMENT_LENGTH);
        for (const seg of segments) {
          const n = seg.index;
          if (Math.abs(n - lineSeg) < 6) continue; // keep the grid clear
          const side = hash(n, 1) < 0.5 ? -1 : 1;

          if (n % 40 === 20) {
            seg.sprites.push({ kind: "billboard", offset: side * 2.1, board: BILLBOARDS[(n / 40 | 0) % BILLBOARDS.length] });
          } else if (n % 16 === 0) {
            seg.sprites.push({ kind: "lamp", offset: -1.3 }, { kind: "lamp", offset: 1.3 });
          } else if (hash(n, 7) < 0.22) {
            seg.sprites.push({ kind: "tree", offset: side * (1.8 + hash(n, 3) * 1.8), size: 0.8 + hash(n, 5) * 0.5 });
          }
        }
      }

      /** Draws one piece of scenery standing on the road at (x, y), s = scale. */
      function renderScenery(item, x, y, s) {
        if (y < 0 || y > height || s < 0.02) return;

        if (item.kind === "tree") {
          const k = s * item.size;
          ctx.fillStyle = "rgba(0,0,0,0.25)";
          ctx.fillRect(x - 40 * k, y - 6 * k, 80 * k, 8 * k);
          ctx.fillStyle = "#6b4526";
          ctx.fillRect(x - 7 * k, y - 50 * k, 14 * k, 50 * k);
          // Three stacked tiers of pine, lighter on the sunny side.
          for (let t = 0; t < 3; t++) {
            const base = y - 36 * k - t * 34 * k;
            const half = (58 - t * 14) * k;
            ctx.fillStyle = "#1f6b2a";
            ctx.beginPath();
            ctx.moveTo(x - half, base);
            ctx.lineTo(x + half, base);
            ctx.lineTo(x, base - 62 * k);
            ctx.fill();
            ctx.fillStyle = "#2f8a36";
            ctx.beginPath();
            ctx.moveTo(x - half, base);
            ctx.lineTo(x - half * 0.1, base);
            ctx.lineTo(x, base - 62 * k);
            ctx.fill();
          }
          return;
        }

        if (item.kind === "lamp") {
          const toward = item.offset < 0 ? 1 : -1; // arm leans over the road
          ctx.fillStyle = "#9aa0a8";
          ctx.fillRect(x - 3 * s, y - 230 * s, 6 * s, 230 * s);
          ctx.fillRect(x, y - 230 * s, toward * 60 * s, 5 * s);
          ctx.fillStyle = "#fff6c0";
          ctx.fillRect(x + toward * 50 * s - 8 * s, y - 226 * s, 16 * s, 6 * s);
          return;
        }

        if (item.kind === "billboard") {
          const b = item.board;
          const w = 240 * s, h = 90 * s, legs = 70 * s;
          ctx.fillStyle = "#5a5a5e";
          ctx.fillRect(x - w * 0.35, y - legs, 8 * s, legs);
          ctx.fillRect(x + w * 0.35 - 8 * s, y - legs, 8 * s, legs);
          ctx.fillStyle = "#2a2a2e";
          ctx.fillRect(x - w / 2 - 4 * s, y - legs - h - 4 * s, w + 8 * s, h + 8 * s);
          ctx.fillStyle = b.panel;
          ctx.fillRect(x - w / 2, y - legs - h, w, h);
          if (h > 7) {
            ctx.fillStyle = b.ink;
            ctx.font = "bold " + Math.round(h * 0.42) + "px 'Press Start 2P', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(b.text, x, y - legs - h / 2, w * 0.9);
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
          }
        }
      }

      /* ------------------------------------------------------ backdrop --- */

      /**
       * Sky, clouds, a snow-capped range and a nearer line of hills, drawn
       * once into canvases twice the screen's width so they can wrap as they
       * slide. The profiles are sums of whole-cycle sines, so they tile.
       */
      function buildBackdrop() {
        const W = width * 2;
        const H = height / 2;
        const layer = () => {
          const c = document.createElement("canvas");
          c.width = W;
          c.height = H;
          return c;
        };
        const ridge = (x, waves) =>
          waves.reduce((sum, [k, amp, phase]) => sum + amp * Math.sin((2 * Math.PI * k * x) / W + phase), 0);

        // Mountains: blue-grey, lit from the left, snow above the snowline.
        const mountains = layer();
        let g = mountains.getContext("2d");
        const peaks = [[3, 38, 0.4], [5, 30, 1.9], [8, 18, 2.7], [13, 9, 0.8], [21, 4, 1.3]];
        for (let x = 0; x < W; x++) {
          const top = H - 110 - ridge(x, peaks);
          const slope = ridge(x + 1, peaks) - ridge(x, peaks);
          g.fillStyle = slope > 0 ? "#7d93b4" : "#627899";
          g.fillRect(x, top, 1, H - top);
          const snowline = H - 150;
          if (top < snowline) {
            // Ragged lower edge, so the snow does not end on a ruled line.
            const depth = Math.min(snowline - top, 24) + 3 + 7 * hash(x >> 2, 5);
            g.fillStyle = slope > 0 ? "#ffffff" : "#d6e2f0";
            g.fillRect(x, top, 1, depth);
          }
        }

        // Hills: nearer, greener, with little tree bumps along the ridge.
        const hills = layer();
        g = hills.getContext("2d");
        const rolls = [[2, 14, 1.1], [5, 9, 0.3], [9, 5, 2.2]];
        for (let x = 0; x < W; x++) {
          const bump = hash(Math.floor(x / 9), 11) < 0.5 ? 4 * Math.sin(((x % 9) / 9) * Math.PI) : 0;
          const top = H - 38 - ridge(x, rolls) - bump;
          g.fillStyle = bump > 0 ? "#2f7d34" : "#3b8f3a";
          g.fillRect(x, top, 1, H - top);
        }

        // Clouds: clusters of overlapping puffs, shaded underneath.
        const clouds = layer();
        g = clouds.getContext("2d");
        for (let i = 0; i < 6; i++) {
          const cx = (i + hash(i, 21) * 0.6) * (W / 6), cy = 24 + hash(i, 22) * (H * 0.28);
          const size = 12 + hash(i, 23) * 16;
          for (let p = 0; p < 6; p++) {
            const px = cx + (p - 2.5) * size * 0.7, py = cy + (p % 2) * size * 0.25;
            g.fillStyle = "#dfeaf4";
            g.beginPath();
            g.arc(px, py + size * 0.18, size * 0.62, 0, Math.PI * 2);
            g.fill();
            g.fillStyle = "#ffffff";
            g.beginPath();
            g.arc(px, py, size * 0.6, 0, Math.PI * 2);
            g.fill();
          }
        }

        return { mountains, hills, clouds };
      }

      function renderLayer(canvas, rate) {
        const W = canvas.width;
        const shift = (((bgOffset * rate * W) % W) + W) % W;
        ctx.drawImage(canvas, -shift, 0);
        ctx.drawImage(canvas, W - shift, 0);
      }

      function renderBackdrop() {
        if (!backdrop) backdrop = buildBackdrop();
        const horizon = height / 2;

        const sky = ctx.createLinearGradient(0, 0, 0, horizon);
        sky.addColorStop(0, SKY_TOP);
        sky.addColorStop(1, SKY_HORIZON);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, horizon);

        renderLayer(backdrop.clouds, 0.25);
        renderLayer(backdrop.mountains, 0.5);

        // Haze where the mountains meet the horizon.
        const haze = ctx.createLinearGradient(0, horizon - 70, 0, horizon);
        haze.addColorStop(0, "rgba(196, 220, 236, 0)");
        haze.addColorStop(1, "rgba(196, 220, 236, 0.85)");
        ctx.fillStyle = haze;
        ctx.fillRect(0, horizon - 70, width, 70);

        renderLayer(backdrop.hills, 1);

        // Ground below the horizon; the road segments paint over it.
        ctx.fillStyle = COLORS.LIGHT.grass;
        ctx.fillRect(0, horizon, width, height - horizon);
      }

      // --- AUDIO SYSTEM ---
      // --- AUDIO (shared module) ---
      const Sound = {
        engineOsc: null,
        engineGain: null,

        // Unlike the old one-shot schedule, this loop can be stopped.
        music: Arcade.Audio.loop({
          notes: [110, 110, 130, 110, 146, 130, 110, 98], // A2-ish bass line
          tempo: 150,
          type: "square",
          volume: 0.1,
          noteDuration: 0.13,
        }),

        init: function () {
          Arcade.Audio.context();
        },

        playBeep: function (freq) {
          Arcade.Audio.tone(freq || 440, {
            duration: 0.3,
            type: "sine",
            volume: 0.3,
          });
        },

        startMusic: function () {
          this.music.start();
        },

        stopMusic: function () {
          this.music.stop();
        },

        // A sustained drone whose pitch tracks speed - its own graph, but
        // routed through the shared mute knob.
        startEngine: function () {
          const ctxA = Arcade.Audio.context();
          if (!ctxA || this.engineOsc) return; // already idling

          this.engineOsc = ctxA.createOscillator();
          this.engineOsc.type = "sawtooth";
          this.engineGain = ctxA.createGain();
          this.engineGain.gain.value = 0.05;

          // Low pass filter to muffle the harsh saw wave
          const filter = ctxA.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 400;

          this.engineOsc.connect(filter);
          filter.connect(this.engineGain);
          this.engineGain.connect(Arcade.Audio.output());
          this.engineOsc.start();
        },

        stopEngine: function () {
          if (this.engineOsc) {
            this.engineOsc.stop();
            this.engineOsc.disconnect();
            this.engineOsc = null;
          }
          if (this.engineGain) {
            this.engineGain.disconnect();
            this.engineGain = null;
          }
        },

        updateEngine: function (speedPercent) {
          if (!this.engineOsc) return;
          // Pitch from 60Hz (idle) to 200Hz (max)
          const ctxA = Arcade.Audio.context();
          this.engineOsc.frequency.setTargetAtTime(
            60 + speedPercent * 140,
            ctxA.currentTime,
            0.1
          );
          // Slight wobble for "purr"
          this.engineGain.gain.value = 0.05 + Math.random() * 0.01;
        },

        playCrash: function () {
          Arcade.Audio.noise({
            duration: 0.5,
            volume: 0.3,
            filterFrom: 1200,
            filterTo: 200,
          });
        },
      };

      function updateHud() {
        document.getElementById("speedVal").innerText = Math.floor(speed / 100);
        document.getElementById("scoreVal").innerText = Math.floor(score);
        document.getElementById("lapVal").innerText = Math.min(
          playerLap,
          TOTAL_LAPS
        );
        if (playerBestLap !== null) {
          document.getElementById("bestVal").innerText =
            playerBestLap.toFixed(2);
        }
      }

      // Update Init to allow audio context start
      Arcade.Shell.init({
        game: GAME_KEY,
        onPause: () => Sound.stopEngine(),
        onResume: () => {
          if (raceStarted && !raceFinished && !isCrashed) Sound.startEngine();
        },
      });

      renderScores();
      window.onload = function () {
        init();
        Arcade.Shell.fit("#game-container");
      };

      // Hook up Engine Sound in Update
      const originalUpdate = update;
      update = function (dt) {
        originalUpdate(dt);
        if (gameRunning && raceStarted && !isCrashed && !raceFinished) {
          Sound.updateEngine(speed / maxSpeed);
        }
      };

      // Hook up Crash Sound
      const originalCrash = crash;
      crash = function (car) {
        if (!isCrashed) {
          // Only play if not already crashed
          Sound.playCrash();
          Sound.stopEngine(); // update() restarts it when the wreck clears
        }
        originalCrash(car);
      };
    </script>
  </body>
</html>
