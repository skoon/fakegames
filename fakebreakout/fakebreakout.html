<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakout Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #0f172a;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        touch-action: none;
      }

      #game-container {
        position: relative;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        border: 4px solid #334155;
        border-radius: 4px;
        background: #020617;
        max-height: 85vh;
        aspect-ratio: 19 / 25;
        display: flex;
      }

      canvas {
        display: block;
        height: 100%;
        width: auto;
        max-width: 100%;
      }

      .stats {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 570px;
        padding: 10px;
        font-size: 1.2rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #94a3b8;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.9);
        z-index: 10;
        text-align: center;
        padding: 20px;
      }

      .btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        font-size: 1.1rem;
        cursor: pointer;
        margin-top: 20px;
        transition: all 0.2s;
        font-weight: bold;
      }

      .btn:hover {
        background: #2563eb;
        transform: scale(1.05);
      }

      .shake {
        animation: shake 0.15s ease-in-out;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
        }

        25% {
          transform: translate(-3px, 3px);
        }

        50% {
          transform: translate(3px, -3px);
        }

        75% {
          transform: translate(-3px, -3px);
        }
      }
    </style>
    <link rel="stylesheet" href="../arcade/arcade.css" />
  </head>

  <body>
    <div class="stats">
      <div id="score-display">Score: 0</div>
      <div id="level-display">Level: 1</div>
      <div id="lives-display">Balls: 3</div>
    </div>

    <div id="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="start-overlay" class="overlay">
        <h1 class="text-5xl font-black mb-6 text-blue-500 italic">BREAKOUT</h1>
        <div class="space-y-2 text-gray-300">
          <p>Move: <span class="text-white font-bold">Arrow Keys</span></p>
          <p>Launch: <span class="text-white font-bold">Space Bar</span></p>
          <p class="text-sm text-gray-400">P Pause &middot; M Mute &middot; ESC Arcade</p>
        </div>
        <pre class="high-scores mt-4 text-yellow-400 text-sm leading-6"></pre>
        <button class="btn" onclick="initGame()">START GAME</button>
      </div>

      <div id="game-over-overlay" class="overlay" style="display: none">
        <h1 id="end-title" class="text-4xl font-bold mb-4">GAME OVER</h1>
        <p id="final-score" class="text-xl text-gray-400">Final Score: 0</p>
        <pre class="high-scores mt-4 text-yellow-400 text-sm leading-6"></pre>
        <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
      </div>

      <div
        id="launch-hint"
        class="absolute bottom-1/3 left-0 w-full text-center text-blue-400 font-bold animate-pulse"
        style="display: none"
      >
        PRESS SPACE TO LAUNCH
      </div>
    </div>

    <script src="../arcade/audio.js"></script>
    <script src="../arcade/input.js"></script>
    <script src="../arcade/scores.js"></script>
    <script src="../arcade/shell.js"></script>
    <script>
      /**
       * ARENA CONFIGURATION
       * 19 blocks wide, 25 blocks high
       */
      const BLOCK_SIZE = 30;
      const GRID_WIDTH = 19;
      const GRID_HEIGHT = 25;
      const CANVAS_WIDTH = GRID_WIDTH * BLOCK_SIZE;
      const CANVAS_HEIGHT = GRID_HEIGHT * BLOCK_SIZE;

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const container = document.getElementById("game-container");

      // Cache DOM elements
      const startOverlay = document.getElementById("start-overlay");
      const gameOverOverlay = document.getElementById("game-over-overlay");
      const launchHint = document.getElementById("launch-hint");
      const scoreDisplay = document.getElementById("score-display");
      const levelDisplay = document.getElementById("level-display");
      const livesDisplay = document.getElementById("lives-display");
      const endTitle = document.getElementById("end-title");
      const finalScore = document.getElementById("final-score");

      // Pre-computed constants
      const PARTICLE_DECAY = 0.025;
      const TWO_PI = Math.PI * 2;

      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;

      const ROW_COLORS = [
        "#ef4444", // Red
        "#f97316", // Orange
        "#facc15", // Yellow
        "#22c55e", // Green
        "#3b82f6", // Blue
      ];

      // Game State
      let score = 0;
      let lives = 3;
      let currentLevel = 1;
      let gameActive = false;
      let ballActive = false;
      const GAME_KEY = "breakout";

      // Breakout was the only silent cabinet. Pitch rises toward the top rows,
      // the way the original does.
      const Sound = {
        brick(row) {
          Arcade.Audio.tone(Math.max(180, 640 - Math.min(row, 7) * 60), {
            duration: 0.06,
            type: "square",
            volume: 0.18,
          });
        },
        paddle() {
          Arcade.Audio.tone(160, { duration: 0.07, type: "square", volume: 0.18 });
        },
        wall() {
          Arcade.Audio.tone(320, { duration: 0.04, type: "square", volume: 0.12 });
        },
        lost() {
          Arcade.Audio.noise({ duration: 0.5, volume: 0.35, filterFrom: 800, filterTo: 80 });
        },
        levelUp() {
          [523, 659, 784].forEach((f, i) =>
            Arcade.Audio.tone(f, { duration: 0.12, delay: i * 0.1, type: "square", volume: 0.2 })
          );
        },
      };
      let blocks = [];
      let particles = [];

      // Level Definitions
      // Characters: ' ' = empty, '#' = random color row, '0'-'9' = fixed color index
      const LEVELS = {
        1: [
          "               ",
          " ############# ",
          " ############# ",
          " ############# ",
          " ############# ",
          "               ",
        ],
        2: [
          " # # # # # # # ",
          "               ",
          " # # # # # # # ",
          "               ",
          " # # # # # # # ",
          "               ",
          " # # # # # # # ",
        ],
        3: [
          "      ###      ",
          "     #####     ",
          "    #######    ",
          "   #########   ",
          "  ###########  ",
          " ############# ",
          "###############",
        ],
        4: [
          "##           ##",
          "###         ###",
          "####       ####",
          "#####     #####",
          "######   ######",
          "#####     #####",
          "####       ####",
          "###         ###",
          "##           ##",
        ],
      };

      // Paddle: 3 blocks wide, 1 block height, 1 block above bottom
      const paddle = {
        width: BLOCK_SIZE * 3,
        height: BLOCK_SIZE,
        x: (CANVAS_WIDTH - BLOCK_SIZE * 3) / 2,
        y: (GRID_HEIGHT - 2) * BLOCK_SIZE,
        speed: 10,
        color: "#00d4ff", // Light Blue
      };
      const HALF_PADDLE_WIDTH = paddle.width / 2;

      const ball = {
        x: 0,
        y: 0,
        radius: 7,
        dx: 0,
        dy: 0,
        speed: 8,
        color: "#ffffff",
      };

      function generateRandomLayout() {
        const rows = Math.floor(Math.random() * 6) + 4; // 4 to 9 rows
        const layout = [];
        for (let r = 0; r < rows; r++) {
          let rowStr = "";
          for (let c = 0; c < 15; c++) {
            // 60% chance of block, 40% space
            rowStr += Math.random() > 0.4 ? "#" : " ";
          }
          layout.push(rowStr);
        }
        return layout;
      }

      function createBlocks() {
        blocks = [];
        const blockWidth = BLOCK_SIZE;
        const blockHeight = BLOCK_SIZE;
        // Center the 15-block wide grid
        const startX = (CANVAS_WIDTH - 15 * blockWidth) / 2;
        const startY = BLOCK_SIZE * 2;

        let layout = LEVELS[currentLevel];
        if (!layout) {
          layout = generateRandomLayout();
        }

        for (let r = 0; r < layout.length; r++) {
          const rowString = layout[r];
          // Ensure we don't exceed 15 columns even if string is longer
          const cols = Math.min(rowString.length, 15);

          for (let c = 0; c < cols; c++) {
            const char = rowString[c];
            if (char === " " || char === ".") continue;

            let color = ROW_COLORS[r % ROW_COLORS.length];

            // Check if char is a digit for custom color index
            if (!isNaN(parseInt(char))) {
              const colorIdx = parseInt(char) % ROW_COLORS.length;
              color = ROW_COLORS[colorIdx];
            }

            blocks.push({
              x: startX + c * blockWidth,
              y: startY + r * blockHeight,
              width: blockWidth - 2,
              height: blockHeight - 2,
              color: color,
              row: r,
              active: true,
            });
          }
        }
      }

      // Offscreen canvas for grid
      let gridCanvas = null;
      function initGridCanvas() {
        if (gridCanvas) return;
        gridCanvas = document.createElement("canvas");
        gridCanvas.width = CANVAS_WIDTH;
        gridCanvas.height = CANVAS_HEIGHT;
        const gCtx = gridCanvas.getContext("2d");

        gCtx.strokeStyle = "#1e293b";
        gCtx.lineWidth = 0.5;
        for (let i = 0; i <= GRID_WIDTH; i++) {
          gCtx.beginPath();
          gCtx.moveTo(i * BLOCK_SIZE, 0);
          gCtx.lineTo(i * BLOCK_SIZE, CANVAS_HEIGHT);
          gCtx.stroke();
        }
        for (let j = 0; j <= GRID_HEIGHT; j++) {
          gCtx.beginPath();
          gCtx.moveTo(0, j * BLOCK_SIZE);
          gCtx.lineTo(CANVAS_WIDTH, j * BLOCK_SIZE);
          gCtx.stroke();
        }
      }

      function initGame() {
        startOverlay.style.display = "none";
        gameOverOverlay.style.display = "none";
        initGridCanvas();
        gameActive = true;
        // Only reset score and level if this is a full reset/start
        if (score === 0 && currentLevel === 1) {
          score = 0;
          currentLevel = 1;
        }
        lives = 3;
        updateUI();
        createBlocks();
        resetBall();
        requestAnimationFrame(update);
      }

      function nextLevel() {
        currentLevel++;
        gameActive = false;
        Sound.levelUp();
        ballActive = false;

        // Show brief "Level Complete" message or just transition
        // For now, instant transition with a small delay could be nice,
        // but let's just rebuild the board and continue.
        // We'll reset ball but keep lives/score.

        createBlocks();
        resetBall();
        gameActive = true;
        updateUI();

        // Flash level display
        levelDisplay.style.color = "#fff";
        levelDisplay.style.transform = "scale(1.5)";
        setTimeout(() => {
          levelDisplay.style.color = "#94a3b8";
          levelDisplay.style.transform = "scale(1)";
        }, 500);
      }

      function resetGame() {
        score = 0;
        currentLevel = 1;
        initGame();
      }

      function resetBall() {
        ballActive = false;
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius;
        ball.dx = 0;
        ball.dy = 0;
        ball.dy = 0;
        launchHint.style.display = "block";
      }

      function launchBall() {
        if (!ballActive && gameActive) {
          ballActive = true;
          // Launch upward at a random angle
          const angle = (Math.random() * 60 + 60) * (Math.PI / 180); // 60 to 120 degrees
          ball.dx =
            Math.cos(angle) * ball.speed * (Math.random() > 0.5 ? 1 : -1);
          ball.dx =
            Math.cos(angle) * ball.speed * (Math.random() > 0.5 ? 1 : -1);
          ball.dy = -Math.abs(Math.sin(angle) * ball.speed);
          launchHint.style.display = "none";
        }
      }

      function createParticles(x, y, color) {
        for (let i = 0; i < 10; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            size: Math.random() * 4 + 1,
            life: 1.0,
            color: color,
          });
        }
      }

      function updateUI() {
        scoreDisplay.innerText = `Score: ${score}`;
        levelDisplay.innerText = `Level: ${currentLevel}`;
        livesDisplay.innerText = `Balls: ${lives}`;
      }

      function showGameOver(won = false) {
        gameActive = false;

        gameOverOverlay.style.display = "flex";
        endTitle.innerText = won ? "VICTORY!" : "GAME OVER";
        endTitle.style.color = won ? "#22c55e" : "#ef4444";
        finalScore.innerText = `Final Score: ${score}`;

        if (Arcade.Scores.qualifies(GAME_KEY, score)) {
          Arcade.Scores.promptInitials(score, (initials) => {
            Arcade.Scores.submit(GAME_KEY, initials, score);
            renderScores();
          });
        }
        renderScores();
      }

      function renderScores() {
        for (const el of document.querySelectorAll(".high-scores")) {
          el.textContent = Arcade.Scores.format(GAME_KEY);
        }
      }

      function triggerShake() {
        container.classList.remove("shake");
        void container.offsetWidth;
        container.classList.add("shake");
      }

      function update() {
        if (!gameActive) return;

        // Keep the frame loop alive while paused, but advance nothing.
        if (Arcade.Shell.paused) {
          requestAnimationFrame(update);
          return;
        }

        if (Arcade.Input.justPressed("fire")) launchBall();

        // Move Paddle
        if (Arcade.Input.held("left") && paddle.x > 0) {
          paddle.x -= paddle.speed;
        }
        if (
          Arcade.Input.held("right") &&
          paddle.x + paddle.width < CANVAS_WIDTH
        ) {
          paddle.x += paddle.speed;
        }

        if (ballActive) {
          ball.x += ball.dx;
          ball.y += ball.dy;

          /**
           * WALL BOUNCING
           * Sides and Top
           */
          // Right Wall
          if (ball.x + ball.radius > CANVAS_WIDTH) {
            ball.dx *= -1;
            ball.x = CANVAS_WIDTH - ball.radius;
            Sound.wall();
          }
          // Left Wall
          else if (ball.x - ball.radius < 0) {
            ball.dx *= -1;
            ball.x = ball.radius;
            Sound.wall();
          }

          // Top Wall
          if (ball.y - ball.radius < 0) {
            ball.dy *= -1;
            ball.y = ball.radius;
            Sound.wall();
          }

          // Paddle Collision
          if (
            ball.dy > 0 &&
            ball.y + ball.radius > paddle.y &&
            ball.y - ball.radius < paddle.y + paddle.height &&
            ball.x > paddle.x &&
            ball.x < paddle.x + paddle.width
          ) {
            ball.dy = -Math.abs(ball.dy); // Ensure it always goes up
            Sound.paddle();
            // Adjust horizontal velocity based on where it hit the paddle
            let hitPoint =
              (ball.x - (paddle.x + HALF_PADDLE_WIDTH)) / HALF_PADDLE_WIDTH;
            ball.dx = hitPoint * ball.speed;
          }

          // Block Collision
          let activeBlocksFound = false;
          for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            if (block.active) {
              activeBlocksFound = true;
              if (
                ball.x + ball.radius > block.x &&
                ball.x - ball.radius < block.x + block.width &&
                ball.y + ball.radius > block.y &&
                ball.y - ball.radius < block.y + block.height
              ) {
                block.active = false;
                ball.dy *= -1;
                score += 20;
                Sound.brick(block.row);
                updateUI();
                createParticles(
                  block.x + block.width / 2,
                  block.y + block.height / 2,
                  block.color
                );
                triggerShake();
                break;
              }
            }
          }

          if (!activeBlocksFound) {
            nextLevel();
          }

          // Lose Life (Passes bottom)
          if (ball.y - ball.radius > CANVAS_HEIGHT) {
            Sound.lost();
            lives--;
            updateUI();
            if (lives <= 0) {
              showGameOver(false);
            } else {
              resetBall();
            }
          }
        } else {
          // Ball follows paddle before launch
          ball.x = paddle.x + paddle.width / 2;
          ball.y = paddle.y - ball.radius;
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= PARTICLE_DECAY;
          if (p.life <= 0) particles.splice(i, 1);
        }

        draw();
        requestAnimationFrame(update);
      }

      function draw() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Subtle Background Grid (Cached)
        if (gridCanvas) ctx.drawImage(gridCanvas, 0, 0);

        // Draw Blocks
        for (let block of blocks) {
          if (block.active) {
            ctx.fillStyle = block.color;
            ctx.beginPath();
            ctx.roundRect(block.x, block.y, block.width, block.height, 3);
            ctx.fill();
            // Block detail
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(block.x, block.y, block.width, 3);
          }
        }

        // Draw Paddle
        ctx.fillStyle = paddle.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = paddle.color;
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 4);
        ctx.fill();

        // Draw Ball (reuse shadow blur but change color)
        ctx.fillStyle = ball.color;
        ctx.shadowColor = "white";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, TWO_PI);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Particles
        for (let p of particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, TWO_PI);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      Arcade.Shell.init({ game: GAME_KEY });
      renderScores();
    </script>
  </body>
</html>
