<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 4px solid #334155;
            border-radius: 4px;
            background: #020617;
            max-height: 85vh;
            aspect-ratio: 19 / 25;
            display: flex;
        }

        canvas {
            display: block;
            height: 100%;
            width: auto;
            max-width: 100%;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 570px;
            padding: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.9);
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }

        .shake {
            animation: shake 0.15s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-3px, 3px);
            }

            50% {
                transform: translate(3px, -3px);
            }

            75% {
                transform: translate(-3px, -3px);
            }
        }
    </style>
</head>

<body>

    <div class="stats">
        <div id="score-display">Score: 0</div>
        <div id="lives-display">Balls: 3</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="start-overlay" class="overlay">
            <h1 class="text-5xl font-black mb-6 text-blue-500 italic">BREAKOUT</h1>
            <div class="space-y-2 text-gray-300">
                <p>Move: <span class="text-white font-bold">Arrow Keys</span></p>
                <p>Launch: <span class="text-white font-bold">Space Bar</span></p>
            </div>
            <button class="btn" onclick="initGame()">START GAME</button>
        </div>

        <div id="game-over-overlay" class="overlay" style="display: none;">
            <h1 id="end-title" class="text-4xl font-bold mb-4">GAME OVER</h1>
            <p id="final-score" class="text-xl text-gray-400">Final Score: 0</p>
            <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
        </div>

        <div id="launch-hint"
            class="absolute bottom-1/3 left-0 w-full text-center text-blue-400 font-bold animate-pulse"
            style="display: none;">
            PRESS SPACE TO LAUNCH
        </div>
    </div>

    <script>
        /**
         * ARENA CONFIGURATION
         * 19 blocks wide, 25 blocks high
         */
        const BLOCK_SIZE = 30;
        const GRID_WIDTH = 19;
        const GRID_HEIGHT = 25;
        const CANVAS_WIDTH = GRID_WIDTH * BLOCK_SIZE;
        const CANVAS_HEIGHT = GRID_HEIGHT * BLOCK_SIZE;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const ROW_COLORS = [
            '#ef4444', // Red
            '#f97316', // Orange
            '#facc15', // Yellow
            '#22c55e', // Green
            '#3b82f6'  // Blue
        ];

        // Game State
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let ballActive = false;
        let keys = {};
        let blocks = [];
        let particles = [];

        // Paddle: 3 blocks wide, 1 block height, 1 block above bottom
        const paddle = {
            width: BLOCK_SIZE * 3,
            height: BLOCK_SIZE,
            x: (CANVAS_WIDTH - (BLOCK_SIZE * 3)) / 2,
            y: (GRID_HEIGHT - 2) * BLOCK_SIZE,
            speed: 10,
            color: '#00d4ff' // Light Blue
        };

        const ball = {
            x: 0,
            y: 0,
            radius: 7,
            dx: 0,
            dy: 0,
            speed: 8,
            color: '#ffffff'
        };

        function createBlocks() {
            blocks = [];
            const blockWidth = BLOCK_SIZE;
            const blockHeight = BLOCK_SIZE;
            // Center the 15-block wide grid
            const startX = (CANVAS_WIDTH - (15 * blockWidth)) / 2;
            const startY = BLOCK_SIZE * 2;

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 15; c++) {
                    blocks.push({
                        x: startX + c * blockWidth,
                        y: startY + r * blockHeight,
                        width: blockWidth - 2,
                        height: blockHeight - 2,
                        color: ROW_COLORS[r],
                        active: true
                    });
                }
            }
        }

        function initGame() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('game-over-overlay').style.display = 'none';
            gameActive = true;
            score = 0;
            lives = 3;
            updateUI();
            createBlocks();
            resetBall();
            requestAnimationFrame(update);
        }

        function resetGame() {
            initGame();
        }

        function resetBall() {
            ballActive = false;
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius;
            ball.dx = 0;
            ball.dy = 0;
            document.getElementById('launch-hint').style.display = 'block';
        }

        function launchBall() {
            if (!ballActive && gameActive) {
                ballActive = true;
                // Launch upward at a random angle
                const angle = (Math.random() * 60 + 60) * (Math.PI / 180); // 60 to 120 degrees
                ball.dx = Math.cos(angle) * ball.speed * (Math.random() > 0.5 ? 1 : -1);
                ball.dy = -Math.abs(Math.sin(angle) * ball.speed);
                document.getElementById('launch-hint').style.display = 'none';
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 1,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateUI() {
            document.getElementById('score-display').innerText = `Score: ${score}`;
            document.getElementById('lives-display').innerText = `Balls: ${lives}`;
        }

        function showGameOver(won = false) {
            gameActive = false;
            const overlay = document.getElementById('game-over-overlay');
            const title = document.getElementById('end-title');
            const scoreText = document.getElementById('final-score');

            overlay.style.display = 'flex';
            title.innerText = won ? "VICTORY!" : "GAME OVER";
            title.style.color = won ? "#22c55e" : "#ef4444";
            scoreText.innerText = `Final Score: ${score}`;
        }

        function triggerShake() {
            container.classList.remove('shake');
            void container.offsetWidth;
            container.classList.add('shake');
        }

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') launchBall();
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function update() {
            if (!gameActive) return;

            // Move Paddle
            if (keys['ArrowLeft'] && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            if (keys['ArrowRight'] && paddle.x + paddle.width < CANVAS_WIDTH) {
                paddle.x += paddle.speed;
            }

            if (ballActive) {
                ball.x += ball.dx;
                ball.y += ball.dy;

                /**
                 * WALL BOUNCING
                 * Sides and Top
                 */
                // Right Wall
                if (ball.x + ball.radius > CANVAS_WIDTH) {
                    ball.dx *= -1;
                    ball.x = CANVAS_WIDTH - ball.radius;
                }
                // Left Wall
                else if (ball.x - ball.radius < 0) {
                    ball.dx *= -1;
                    ball.x = ball.radius;
                }

                // Top Wall
                if (ball.y - ball.radius < 0) {
                    ball.dy *= -1;
                    ball.y = ball.radius;
                }

                // Paddle Collision
                if (ball.dy > 0 &&
                    ball.y + ball.radius > paddle.y &&
                    ball.y - ball.radius < paddle.y + paddle.height &&
                    ball.x > paddle.x && ball.x < paddle.x + paddle.width) {

                    ball.dy = -Math.abs(ball.dy); // Ensure it always goes up
                    // Adjust horizontal velocity based on where it hit the paddle
                    let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    ball.dx = hitPoint * ball.speed;
                }

                // Block Collision
                let activeBlocksFound = false;
                for (let block of blocks) {
                    if (block.active) {
                        activeBlocksFound = true;
                        if (ball.x + ball.radius > block.x &&
                            ball.x - ball.radius < block.x + block.width &&
                            ball.y + ball.radius > block.y &&
                            ball.y - ball.radius < block.y + block.height) {

                            block.active = false;
                            ball.dy *= -1;
                            score += 20;
                            updateUI();
                            createParticles(block.x + block.width / 2, block.y + block.height / 2, block.color);
                            triggerShake();
                            break;
                        }
                    }
                }

                if (!activeBlocksFound) showGameOver(true);

                // Lose Life (Passes bottom)
                if (ball.y - ball.radius > CANVAS_HEIGHT) {
                    lives--;
                    updateUI();
                    if (lives <= 0) {
                        showGameOver(false);
                    } else {
                        resetBall();
                    }
                }
            } else {
                // Ball follows paddle before launch
                ball.x = paddle.x + paddle.width / 2;
                ball.y = paddle.y - ball.radius;
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.025;
                if (p.life <= 0) particles.splice(i, 1);
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Subtle Background Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_WIDTH; i++) {
                ctx.beginPath(); ctx.moveTo(i * BLOCK_SIZE, 0); ctx.lineTo(i * BLOCK_SIZE, CANVAS_HEIGHT); ctx.stroke();
            }
            for (let j = 0; j <= GRID_HEIGHT; j++) {
                ctx.beginPath(); ctx.moveTo(0, j * BLOCK_SIZE); ctx.lineTo(CANVAS_WIDTH, j * BLOCK_SIZE); ctx.stroke();
            }

            // Draw Blocks
            for (let block of blocks) {
                if (block.active) {
                    ctx.fillStyle = block.color;
                    ctx.beginPath();
                    ctx.roundRect(block.x, block.y, block.width, block.height, 3);
                    ctx.fill();
                    // Block detail
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.fillRect(block.x, block.y, block.width, 3);
                }
            }

            // Draw Paddle
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = paddle.color;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 4);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Ball
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'white';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

    </script>
</body>

</html>
