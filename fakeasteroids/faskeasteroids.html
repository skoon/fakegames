<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Retro Asteroids 8-Bit with Explosions</title>
    <style>
      body {
        background-color: #111;
        color: #eee;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }

      canvas {
        border: 4px solid #eee;
        background-color: #000;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        image-rendering: pixelated;
      }

      #ui {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
      }
    </style>
    <link rel="stylesheet" href="../arcade/arcade.css" />
  </head>

  <body>
    <div id="ui">
      <h1 id="score">SCORE: 0</h1>
      <h3 id="lives">LIVES: 3</h3>
      <p id="message" style="display: none; color: #f00; font-weight: bold">
        GAME OVER - PRESS SPACE TO RESTART
      </p>
      <p style="color: #888; font-size: 12px; margin-top: 4px">
        ARROWS move &middot; SPACE fire &middot; SHIFT hyperspace &middot; P pause &middot; M mute
      </p>
      <pre id="scores" style="color: #ff0; font-size: 14px; margin-top: 8px"></pre>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="../arcade/audio.js"></script>
    <script src="../arcade/input.js"></script>
    <script src="../arcade/scores.js"></script>
    <script src="../arcade/shell.js"></script>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const msgEl = document.getElementById("message");
      const scoresEl = document.getElementById("scores");

      // --- Game Constants ---
      const FPS = 60;
      const INV_FPS = 1 / FPS; // Inverse FPS for multiplication
      const SHIP_SIZE = 20;
      const TURN_SPEED = 180; // Degrees per second
      const TURN_RATE = (TURN_SPEED / 180) * Math.PI * INV_FPS; // Pre-computed turn rate
      const THRUST = 5; // Acceleration
      const FRICTION = 0.7; // 0 = no friction, 1 = lots
      const ROIDS_NUM = 5; // Starting number of asteroids
      const ROIDS_SIZE = 50; // Starting size
      const MIN_ROID_SIZE = Math.ceil(ROIDS_SIZE / 4); // Min size before splitting stops
      const ROIDS_SPD = 50; // Max speed pixels per second
      const BULLET_SPD = 5; // pixels per frame
      const SHIP_LW = SHIP_SIZE / 15; // Ship line width
      const THRUST_LW = SHIP_SIZE / 10; // Thrust line width
      const ROID_LW = SHIP_SIZE / 20; // Asteroid line width
      // UFO Constants. The big saucer is slow, sprays wildly and is cheap; the
      // small one is fast, aims properly and is worth five times as much.
      const UFO_SIZE = 20;
      const UFO_SPEED = 3; // pixels per frame
      const UFO_LARGE = {
        size: UFO_SIZE,
        speed: UFO_SPEED,
        points: 200,
        fireInterval: 90, // frames
        spread: 0.6, // radians of aiming error
      };
      const UFO_SMALL = {
        size: UFO_SIZE * 0.6,
        speed: UFO_SPEED * 1.4,
        points: 1000,
        fireInterval: 70,
        spread: 0.12,
      };
      const UFO_BULLET_SPD = 4;
      const UFO_BULLET_LIFE = 90; // frames before it fizzles out

      // The small saucer starts showing up once you are good enough to deserve it.
      const UFO_SMALL_FROM_SCORE = 3000;

      // Hyperspace: a way out that might kill you. A `let` so tests can pin it.
      let hyperspaceMisfireChance = 0.15;

      // Particle constants
      const PARTICLE_NUM = 18;
      const PARTICLE_SPD = 8;
      const PARTICLE_LIFE = 25; // Frames they last
      const INVULN_TIME = 3; // Seconds of invulnerability

      // --- Game State ---
      let score = 0;
      let lives = 3;
      let gameOver = false;
      let asteroids = [];
      let bullets = [];
      let particles = []; // Array to hold explosion particles
      let ufo = {
        x: 0,
        y: 0,
        xv: 0,
        active: false,
        timer: 0, // Frames until next UFO
        kind: UFO_LARGE,
        fireTimer: 0,
      };
      let ufoBullets = [];

      // --- Audio (shared module) ---
      const GAME_KEY = "asteroids";
      let ufoOsc = null;
      let ufoGain = null;

      // Two-note heartbeat that quickens as the field is cleared.
      const music = Arcade.Audio.loop({
        notes: [82.4, 73.4], // low E, low D
        tempo: 1000,
        type: "square",
        volume: 0.05,
        noteDuration: 0.2,
      });

      function initAudio() {
        Arcade.Audio.context();
        if (!music.isPlaying() && !gameOver) music.start();
      }

      function playLaserSound() {
        Arcade.Audio.tone(800, {
          slideTo: 200,
          duration: 0.1,
          type: "sawtooth",
          volume: 0.1,
        });
      }

      function playAsteroidBreakSound() {
        Arcade.Audio.noise({
          duration: 0.1,
          volume: 0.2,
          filterFrom: 1000,
          filterTo: 1000,
        });
      }

      function playExplosionSound() {
        Arcade.Audio.noise({
          duration: 0.4,
          volume: 0.5,
          filterFrom: 1000,
          filterTo: 100,
        });
      }

      function updateMusicTempo() {
        // Faster as the field empties, floored so it stays playable.
        music.setTempo(Math.min(1000, Math.max(200, 200 + asteroids.length * 150)));
      }

      function startUfoSound() {
        const actx = Arcade.Audio.context();
        if (!actx || ufoOsc) return;
        ufoOsc = actx.createOscillator();
        ufoGain = actx.createGain();
        ufoOsc.type = "triangle";
        ufoOsc.frequency.setValueAtTime(200, actx.currentTime);
        ufoOsc.frequency.linearRampToValueAtTime(
          1000,
          actx.currentTime + 1
        ); // Rising siren

        // Loop the siren effect manually or use LFO. For retro style, simple loop is okay-ish,
        // but let's use an LFO for better siren effect.
        const lfo = actx.createOscillator();
        lfo.type = "sawtooth";
        lfo.frequency.value = 8; // 8 Hz wobble
        const lfoGain = actx.createGain();
        lfoGain.gain.value = 50;
        lfo.connect(lfoGain);
        lfoGain.connect(ufoOsc.frequency);
        lfo.start();

        ufoGain.gain.setValueAtTime(0.05, actx.currentTime);
        ufoOsc.connect(ufoGain);
        ufoGain.connect(Arcade.Audio.output());
        ufoOsc.start();
        ufoOsc.lfo = lfo; // Attach lfo to stop it later
      }

      function stopUfoSound() {
        if (ufoOsc) {
          ufoOsc.stop();
          ufoOsc.disconnect();
          if (ufoOsc.lfo) ufoOsc.lfo.stop();
          ufoOsc = null;
        }
        if (ufoGain) {
          ufoGain.disconnect();
          ufoGain = null;
        }
      }

      // Ship Object
      const ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        r: SHIP_SIZE / 2,
        a: (90 / 180) * Math.PI, // Angle (convert to radians)
        rot: 0,
        thrusting: false,
        thrust: { x: 0, y: 0 },
        blinkNum: 0,
        explodeTime: 0, // Added for the 'exploding' check in ship drawing
      };

      // --- Input Handling (shared module, polled each frame) ---
      document.addEventListener("mousedown", () => initAudio());

      function readInput() {
        initAudio();

        if (gameOver) {
          ship.rot = 0;
          ship.thrusting = false;
          if (Arcade.Input.justPressed("fire")) resetGame();
          return;
        }

        if (Arcade.Input.held("left")) ship.rot = TURN_RATE;
        else if (Arcade.Input.held("right")) ship.rot = -TURN_RATE;
        else ship.rot = 0;

        ship.thrusting = Arcade.Input.held("up");

        if (Arcade.Input.justPressed("fire")) shoot();
        if (Arcade.Input.justPressed("fire2")) hyperspace();
      }

      function endGame() {
        gameOver = true;
        music.stop();
        stopUfoSound();
        msgEl.style.display = "block";

        if (Arcade.Scores.qualifies(GAME_KEY, score)) {
          Arcade.Scores.promptInitials(score, (initials) => {
            Arcade.Scores.submit(GAME_KEY, initials, score);
            renderScores();
          });
        }
        renderScores();
      }

      function renderScores() {
        scoresEl.textContent = Arcade.Scores.format(GAME_KEY);
      }

      // --- Logic Helpers ---
      function createAsteroid(x, y, r) {
        const lvlMult = 1 + 0.1;
        const roid = {
          x: x,
          y: y,
          xv:
            ((Math.random() * ROIDS_SPD * lvlMult) / FPS) *
            (Math.random() < 0.5 ? 1 : -1),
          yv:
            ((Math.random() * ROIDS_SPD * lvlMult) / FPS) *
            (Math.random() < 0.5 ? 1 : -1),
          r: r,
          a: Math.random() * Math.PI * 2, // Rotation angle
          vert: Math.floor(Math.random() * 10 + 7),
          offs: [],
          color: `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`,
        };

        // Create Jagged Shape
        for (let j = 0; j < roid.vert; j++) {
          roid.offs.push(Math.random() * 0.4 + 0.8);
        }

        asteroids.push(roid);
      }

      function handleAsteroidCollisions() {
        for (let i = 0; i < asteroids.length; i++) {
          let a1 = asteroids[i];
          for (let j = i + 1; j < asteroids.length; j++) {
            let a2 = asteroids[j];
            let d2 = distSquared(a1.x, a1.y, a2.x, a2.y);
            let rSum = a1.r + a2.r;

            if (d2 < rSum * rSum) {
              let dist = Math.sqrt(d2);
              if (dist === 0) dist = 0.01;

              let nx = (a2.x - a1.x) / dist;
              let ny = (a2.y - a1.y) / dist;

              // Relative velocity
              let dvx = a2.xv - a1.xv;
              let dvy = a2.yv - a1.yv;
              let vDotN = dvx * nx + dvy * ny;

              // If separating, skip
              if (vDotN > 0) continue;

              // Elastic collision (mass approx = radius)
              let m1 = a1.r;
              let m2 = a2.r;
              let impulse = -(2 * vDotN) / (1 / m1 + 1 / m2);

              // Apply impulse
              let ix = impulse * nx;
              let iy = impulse * ny;
              a1.xv -= ix / m1;
              a1.yv -= iy / m1;
              a2.xv += ix / m2;
              a2.yv += iy / m2;

              // Separation to prevent sticking
              let overlap = rSum - dist;
              let totalMassInv = 1 / m1 + 1 / m2;
              let correction = overlap / totalMassInv;
              let cx = correction * nx;
              let cy = correction * ny;

              a1.x -= (cx / m1) * 0.5;
              a1.y -= (cy / m1) * 0.5;
              a2.x += (cx / m2) * 0.5;
              a2.y += (cy / m2) * 0.5;
            }
          }
        }
      }

      function spawnUfo() {
        if (gameOver) return;

        // The better you are doing, the likelier the dangerous one turns up.
        const smallChance = Math.min(0.7, score / (UFO_SMALL_FROM_SCORE * 2));
        ufo.kind = Math.random() < smallChance ? UFO_SMALL : UFO_LARGE;

        ufo.active = true;
        ufo.fireTimer = ufo.kind.fireInterval;
        ufo.y = Math.random() * (canvas.height * 0.8) + canvas.height * 0.1; // Random Y (within margins)
        startUfoSound();
        // Random side (Left or Right)
        if (Math.random() < 0.5) {
          ufo.x = -ufo.kind.size;
          ufo.xv = ufo.kind.speed;
        } else {
          ufo.x = canvas.width + ufo.kind.size;
          ufo.xv = -ufo.kind.speed;
        }
      }

      /** The saucer shoots at the ship, badly or well depending on its size. */
      function ufoShoot() {
        const aim =
          Math.atan2(ship.y - ufo.y, ship.x - ufo.x) +
          (Math.random() - 0.5) * 2 * ufo.kind.spread;

        ufoBullets.push({
          x: ufo.x,
          y: ufo.y,
          xv: UFO_BULLET_SPD * Math.cos(aim),
          yv: UFO_BULLET_SPD * Math.sin(aim),
          life: UFO_BULLET_LIFE,
        });
        Arcade.Audio.tone(320, {
          slideTo: 90,
          duration: 0.12,
          type: "square",
          volume: 0.12,
        });
      }

      function killUfo(awardPoints) {
        if (awardPoints) {
          score += ufo.kind.points;
          scoreEl.textContent = "SCORE: " + score;
        }
        explode(ufo.x, ufo.y);
        ufo.active = false;
        stopUfoSound();
        ufo.timer = Math.floor(Math.random() * (30 * FPS)) + 30 * FPS;
      }

      /**
       * Hyperspace. Teleports the ship anywhere on the field, which is often the
       * only escape from a crowded screen - at the cost of sometimes arriving
       * inside a rock.
       */
      function hyperspace() {
        if (gameOver) return;

        ship.x = Math.random() * canvas.width;
        ship.y = Math.random() * canvas.height;
        ship.thrust.x = 0;
        ship.thrust.y = 0;

        Arcade.Audio.tone(1200, {
          slideTo: 200,
          duration: 0.25,
          type: "sine",
          volume: 0.18,
        });

        if (Math.random() < hyperspaceMisfireChance) {
          // Rematerialised badly.
          explode(ship.x, ship.y);
          playExplosionSound();
          loseLife();
        } else {
          ship.blinkNum = Math.ceil(INVULN_TIME * FPS);
        }
      }

      /** One place that takes a life and decides whether the run is over. */
      function loseLife() {
        lives--;
        livesEl.innerText = "LIVES: " + lives;

        if (lives <= 0) {
          endGame();
          return;
        }

        ship.x = canvas.width / 2;
        ship.y = canvas.height / 2;
        ship.thrust = { x: 0, y: 0 };
        ship.a = (90 / 180) * Math.PI;
        ship.blinkNum = Math.ceil(INVULN_TIME * FPS);
      }

      function distSquared(x1, y1, x2, y2) {
        return Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2);
      }

      function shoot() {
        if (gameOver) return;
        playLaserSound();
        bullets.push({
          x: ship.x + (4 / 3) * ship.r * Math.cos(ship.a),
          y: ship.y - (4 / 3) * ship.r * Math.sin(ship.a),
          xv: BULLET_SPD * Math.cos(ship.a),
          yv: -BULLET_SPD * Math.sin(ship.a),
        });
      }

      // Create explosion particles
      function explode(x, y) {
        for (let i = 0; i < PARTICLE_NUM; i++) {
          particles.push({
            x: x,
            y: y,
            // Random velocity radiating outwards
            xv: (Math.random() - 0.5) * PARTICLE_SPD * Math.random(),
            yv: (Math.random() - 0.5) * PARTICLE_SPD * Math.random(),
            life: PARTICLE_LIFE,
            maxLife: PARTICLE_LIFE,
          });
        }
      }

      function resetGame(newLevel = false) {
        gameOver = false;

        // Only reset score and lives if it's a full reset, not a new level
        if (!newLevel) {
          lives = 3;
          score = 0;
        }

        scoreEl.innerText = "SCORE: " + score;
        livesEl.innerText = "LIVES: " + lives;
        msgEl.style.display = "none";
        asteroids = [];
        bullets = [];
        ufoBullets = [];
        particles = [];
        ship.x = canvas.width / 2;
        ship.y = canvas.height / 2;
        ship.thrust = { x: 0, y: 0 };
        ship.a = (90 / 180) * Math.PI;
        ship.blinkNum = Math.ceil(INVULN_TIME * FPS);

        // Initialize UFO timer (30-60 seconds) -> (30-60) * FPS
        ufo.active = false;
        stopUfoSound();
        ufo.timer = Math.floor(Math.random() * (30 * FPS)) + 30 * FPS;

        let x, y;
        for (let i = 0; i < ROIDS_NUM; i++) {
          do {
            x = Math.floor(Math.random() * canvas.width);
            y = Math.floor(Math.random() * canvas.height);
          } while (
            distSquared(ship.x, ship.y, x, y) <
            Math.pow(ROIDS_SIZE * 2 + ship.r, 2)
          );
          createAsteroid(x, y, Math.ceil(ROIDS_SIZE));
        }
        updateMusicTempo();
        music.start();
        msgEl.style.display = "none";
        renderScores();
      }

      // --- Main Game Loop ---
      function update() {
        if (Arcade.Shell.paused) {
          requestAnimationFrame(update);
          return;
        }
        readInput();

        const cosA = Math.cos(ship.a);
        const sinA = Math.sin(ship.a);

        // 1. Draw Background
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Thrust Logic & Physics
        if (ship.thrusting && !gameOver) {
          ship.thrust.x += THRUST * cosA * INV_FPS;
          ship.thrust.y -= THRUST * sinA * INV_FPS;

          // Draw Thruster
          ctx.fillStyle = "orange";
          ctx.strokeStyle = "yellow";
          ctx.lineWidth = THRUST_LW;
          ctx.beginPath();
          ctx.moveTo(
            // rear left
            ship.x - ship.r * ((2 / 3) * cosA + 0.5 * sinA),
            ship.y + ship.r * ((2 / 3) * sinA - 0.5 * cosA)
          );
          ctx.lineTo(
            // rear center (flame tip)
            ship.x - ((ship.r * 6) / 3) * cosA,
            ship.y + ((ship.r * 6) / 3) * sinA
          );
          ctx.lineTo(
            // rear right
            ship.x - ship.r * ((2 / 3) * cosA - 0.5 * sinA),
            ship.y + ship.r * ((2 / 3) * sinA + 0.5 * cosA)
          );
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        ship.thrust.x -= FRICTION * ship.thrust.x * INV_FPS;
        ship.thrust.y -= FRICTION * ship.thrust.y * INV_FPS;

        if (!gameOver) {
          ship.x += ship.thrust.x;
          ship.y += ship.thrust.y;
          ship.a += ship.rot;
        }

        // Screen Wrapping (Ship)
        if (ship.x < 0 - ship.r) ship.x = canvas.width + ship.r;
        else if (ship.x > canvas.width + ship.r) ship.x = 0 - ship.r;
        if (ship.y < 0 - ship.r) ship.y = canvas.height + ship.r;
        else if (ship.y > canvas.height + ship.r) ship.y = 0 - ship.r;

        // 3. Draw Ship (Triangle)
        if (ship.blinkNum > 0) {
          ship.blinkNum--;
        }

        const blinkOn = Math.floor(ship.blinkNum / 10) % 2 === 0;
        const exploding = ship.explodeTime > 0;

        if (!gameOver && blinkOn && !exploding) {
          ctx.strokeStyle = "white";
          ctx.lineWidth = SHIP_LW;
          ctx.beginPath();
          ctx.moveTo(
            ship.x + (4 / 3) * ship.r * cosA,
            ship.y - (4 / 3) * ship.r * sinA
          );
          ctx.lineTo(
            ship.x - ship.r * ((2 / 3) * cosA + sinA),
            ship.y + ship.r * ((2 / 3) * sinA - cosA)
          );
          ctx.lineTo(
            ship.x - ship.r * ((2 / 3) * cosA - sinA),
            ship.y + ship.r * ((2 / 3) * sinA + cosA)
          );
          ctx.closePath();
          ctx.stroke();
        }

        // 4. Handle Asteroids (Squares)
        handleAsteroidCollisions();
        ctx.strokeStyle = "#aaa";
        ctx.lineWidth = ROID_LW;

        for (let i = asteroids.length - 1; i >= 0; i--) {
          let a = asteroids[i];
          a.x += a.xv;
          a.y += a.yv;
          a.a += 0.01;

          // Screen Wrap Asteroid
          if (a.x < 0 - a.r) a.x = canvas.width + a.r;
          else if (a.x > canvas.width + a.r) a.x = 0 - a.r;
          if (a.y < 0 - a.r) a.y = canvas.height + a.r;
          else if (a.y > canvas.height + a.r) a.y = 0 - a.r;

          // Draw Asteroid (Rock)
          ctx.strokeStyle = a.color;
          ctx.save();
          ctx.translate(a.x, a.y);
          ctx.rotate(a.a);
          ctx.beginPath();
          for (let j = 0; j < a.vert; j++) {
            const angle = (j * Math.PI * 2) / a.vert;
            const r = a.r * a.offs[j];
            if (j === 0) ctx.moveTo(r * Math.cos(angle), r * Math.sin(angle));
            else ctx.lineTo(r * Math.cos(angle), r * Math.sin(angle));
          }
          ctx.closePath();
          ctx.stroke();
          ctx.restore();

          // Collision Ship vs Asteroid
          // Only check collision if not invincible (blinkNum == 0) and not already game over
          if (
            !gameOver &&
            ship.blinkNum == 0 &&
            distSquared(ship.x, ship.y, a.x, a.y) < Math.pow(ship.r + a.r, 2)
          ) {
            explode(ship.x, ship.y);
            playExplosionSound();
            loseLife();
          }
        }

        // 5. Handle Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          let b = bullets[i];
          b.x += b.xv;
          b.y += b.yv;

          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2, 0, Math.PI * 2, false);
          ctx.fill();

          // Collision Bullet vs Asteroid
          for (let j = asteroids.length - 1; j >= 0; j--) {
            let a = asteroids[j];
            if (distSquared(b.x, b.y, a.x, a.y) < Math.pow(a.r * 1.2, 2)) {
              bullets.splice(i, 1);

              // --- TRIGGER EXPLOSION ---
              explode(a.x, a.y);
              // -------------------------

              if (a.r > MIN_ROID_SIZE) {
                createAsteroid(a.x, a.y, a.r / 2);
                createAsteroid(a.x, a.y, a.r / 2);
              }
              asteroids.splice(j, 1);
              playAsteroidBreakSound();
              updateMusicTempo();
              score += 100;
              scoreEl.textContent = "SCORE: " + score;

              if (asteroids.length === 0) {
                resetGame(true); // Persist score for next level
                i = -1; // Stop processing bullets as arrays are reset
                break;
              }
              break;
            }
          }
          if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
          }
        }

        // 6. Handle UFO
        if (!gameOver) {
          if (ufo.active) {
            const uSize = ufo.kind.size;

            // Move UFO
            ufo.x += ufo.xv;

            // Shoot at the ship
            ufo.fireTimer--;
            if (ufo.fireTimer <= 0) {
              ufoShoot();
              ufo.fireTimer = ufo.kind.fireInterval;
            }

            // Draw UFO (Saucer Shape)
            ctx.strokeStyle = ufo.kind === UFO_SMALL ? "#ff5555" : "white";
            ctx.lineWidth = SHIP_LW;
            ctx.beginPath();
            // Bottom arc (Main body)
            ctx.ellipse(ufo.x, ufo.y, uSize, uSize / 2.5, 0, 0, Math.PI * 2);
            // Top arc (Dome)
            ctx.moveTo(ufo.x - uSize / 2, ufo.y - uSize / 6);
            ctx.arc(ufo.x, ufo.y - uSize / 6, uSize / 2, Math.PI, 0);
            ctx.stroke();

            // Collision: Ship vs UFO
            if (
              ship.blinkNum == 0 &&
              distSquared(ship.x, ship.y, ufo.x, ufo.y) <
                Math.pow(ship.r + uSize, 2)
            ) {
              explode(ship.x, ship.y);
              killUfo(false); // ramming it earns you nothing
              playExplosionSound();
              loseLife();
            }

            // Collision: Bullets vs UFO
            for (let i = bullets.length - 1; i >= 0; i--) {
              if (
                distSquared(bullets[i].x, bullets[i].y, ufo.x, ufo.y) <
                Math.pow(uSize, 2)
              ) {
                bullets.splice(i, 1);
                playExplosionSound();
                killUfo(true);
                break;
              }
            }

            // Despawn checks
            if (
              (ufo.xv > 0 && ufo.x > canvas.width + uSize) ||
              (ufo.xv < 0 && ufo.x < -uSize)
            ) {
              ufo.active = false;
              stopUfoSound();
              ufo.timer = Math.floor(Math.random() * (30 * FPS)) + 30 * FPS;
            }
          } else {
            // Timer Logic
            ufo.timer--;
            if (ufo.timer <= 0) {
              spawnUfo();
            }
          }
        }

        // 6b. Saucer fire
        for (let i = ufoBullets.length - 1; i >= 0; i--) {
          const b = ufoBullets[i];
          b.x += b.xv;
          b.y += b.yv;
          b.life--;

          // Wrap like everything else on this screen.
          if (b.x < 0) b.x = canvas.width;
          else if (b.x > canvas.width) b.x = 0;
          if (b.y < 0) b.y = canvas.height;
          else if (b.y > canvas.height) b.y = 0;

          ctx.fillStyle = "#ff5555";
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2, false);
          ctx.fill();

          if (b.life <= 0) {
            ufoBullets.splice(i, 1);
            continue;
          }

          // Saucer fire breaks rocks too, which is how you get free splits.
          let hitRock = false;
          for (let j = asteroids.length - 1; j >= 0; j--) {
            const a = asteroids[j];
            if (distSquared(b.x, b.y, a.x, a.y) < Math.pow(a.r, 2)) {
              explode(a.x, a.y);
              if (a.r > MIN_ROID_SIZE) {
                createAsteroid(a.x, a.y, a.r / 2);
                createAsteroid(a.x, a.y, a.r / 2);
              }
              asteroids.splice(j, 1);
              playAsteroidBreakSound();
              updateMusicTempo();
              hitRock = true;
              break;
            }
          }
          if (hitRock) {
            ufoBullets.splice(i, 1);
            continue;
          }

          if (
            !gameOver &&
            ship.blinkNum === 0 &&
            distSquared(b.x, b.y, ship.x, ship.y) < Math.pow(ship.r, 2)
          ) {
            ufoBullets.splice(i, 1);
            explode(ship.x, ship.y);
            playExplosionSound();
            loseLife();
          }
        }

        // 6. Handle Particles (Explosions)
        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.x += p.xv;
          p.y += p.yv;
          p.life--;

          // Calculate opacity based on remaining life
          let opacity = p.life / p.maxLife;
          ctx.fillStyle = `rgba(220, 220, 220, ${opacity})`;

          // Draw tiny squares for retro feel
          ctx.fillRect(p.x, p.y, 3, 3);

          // Remove dead particles
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }

        requestAnimationFrame(update);
      }

      // Start Game
      Arcade.Shell.init({ game: GAME_KEY });
      renderScores();
      resetGame();
      update();
    </script>
  </body>
